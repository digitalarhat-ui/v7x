<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قصر فينيسيا — مراجعة الإدارة</title></head><body style="background:#15130f;color:#f3eddf;font:15px Arial;padding:30px"><main id="loader">جارٍ تحميل مراجعة الإدارة…</main><script>(async()=>{try{const files=await Promise.all(Array.from({length:6},(_,i)=>fetch('/review/page-'+i+'.part',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('part '+i+' '+r.status);return r.text()})));const doc=files.join('');if(!doc.includes('قصر فينيسيا')||doc.includes('الوردة البيضاء'))throw Error('identity mismatch');document.open();document.write(doc);document.close()}catch(e){document.getElementById('loader').textContent='تعذر تحميل مراجعة الإدارة — '+e.message}})();</script></body></html>
