<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Arhat Follow-up Radar</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101828;background:#f7f8fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:28px 18px 52px}header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.brand{font-size:26px;font-weight:850;letter-spacing:-.03em}.sub{color:#667085;margin-top:6px}button,.btn{border:0;border-radius:11px;background:#101828;color:#fff;padding:11px 15px;font-weight:750;cursor:pointer;text-decoration:none;display:inline-block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.card,.row,.health,.auto{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:18px;box-shadow:0 1px 2px rgba(16,24,40,.03)}.k{font-size:13px;color:#667085}.n{font-size:36px;font-weight:850;margin-top:6px}.danger{color:#b42318}.warn{color:#b54708}.ok{color:#027a48}.purple{color:#6941c6}h2{font-size:19px;margin:28px 0 12px}.row{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:10px}.name{font-size:17px;font-weight:780}.meta{color:#667085;font-size:13px;margin-top:4px}.pill{display:inline-block;margin-top:8px;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800;background:#fee4e2;color:#b42318}.empty{border:1px dashed #d0d5dd;border-radius:14px;background:#fff;padding:22px;color:#667085}.health,.auto{margin-top:28px}.healthgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.hv{font-weight:800;margin-top:3px}.small{font-size:12px;color:#98a2b3;margin-top:14px}.lock{max-width:500px;margin:90px auto;background:white;border:1px solid #e4e7ec;border-radius:18px;padding:24px}.lock input{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;margin:12px 0}.flag{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.yes{background:#ecfdf3;color:#027a48}.no{background:#fff4e5;color:#b54708}@media(max-width:760px){.cards{grid-template-columns:1fr 1fr}.healthgrid{grid-template-columns:1fr 1fr}.row{align-items:flex-start;flex-direction:column}.brand{font-size:22px}}@media(max-width:460px){.cards{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><script>
const qs=new URLSearchParams(location.search);let key=qs.get('key')||sessionStorage.getItem('da_followup_key')||'';if(qs.get('key')){sessionStorage.setItem('da_followup_key',key);history.replaceState({},'',location.pathname)}const app=document.getElementById('app');function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function gate(msg='Enter dashboard key'){app.innerHTML='<div class="lock"><div class="brand">Digital Arhat — Follow-up Radar</div><div class="sub">'+esc(msg)+'</div><input id="k" type="password" placeholder="Dashboard key"><button id="go">Open dashboard</button></div>';go.onclick=()=>{key=k.value.trim();sessionStorage.setItem('da_followup_key',key);render()}}function row(l,due){const p=(l.phone||'').replace(/[^0-9]/g,'');return '<div class="row"><div><div class="name">'+esc(l.name||'Unknown lead')+'</div><div class="meta">'+esc(l.phone||l.id)+' · last outbound '+(l.lastOutboundAt?new Date(l.lastOutboundAt).toLocaleString():'—')+'</div><div class="meta">'+esc(l.lastPreview||'')+'</div>'+(due?'<span class="pill">FOLLOW-UP DUE · '+l.waitingHours+'h</span>':'<div class="meta">Waiting '+l.waitingHours+'h</div>')+(l.niche?'<div class="meta">Context: '+esc(l.niche)+'</div>':'')+'</div>'+(p?'<a class="btn" target="_blank" href="https://wa.me/'+p+'">Open WhatsApp</a>':'')+'</div>'}function flag(v,t){return '<span class="flag '+(v?'yes':'no')+'">'+t+': '+(v?'ON':'OFF')+'</span>'}async function render(){if(!key){gate();return}app.innerHTML='<div class="wrap"><div class="sub">Loading…</div></div>';try{const r=await fetch('/api/leads?key='+encodeURIComponent(key),{cache:'no-store'});if(r.status===401){sessionStorage.removeItem('da_followup_key');key='';gate('Dashboard key was not accepted.');return}const d=await r.json();if(!d.ok)throw new Error();app.innerHTML='<div class="wrap"><header><div><div class="brand">Digital Arhat — Follow-up Radar</div><div class="sub">Exact-thread WhatsApp follow-up tracking with fail-closed identity checks.</div></div><button id="refresh">Refresh</button></header><div class="cards"><div class="card"><div class="k">Follow-up due</div><div class="n danger">'+d.totals.due+'</div></div><div class="card"><div class="k">Still waiting</div><div class="n warn">'+d.totals.waiting+'</div></div><div class="card"><div class="k">Replied / clear</div><div class="n ok">'+d.totals.replied+'</div></div><div class="card"><div class="k">Needs review</div><div class="n purple">'+d.totals.review+'</div></div></div><div class="auto"><b>Auto-follow-up engine</b><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">'+flag(d.automation.enabled,'Auto send')+flag(d.automation.apiConnected,'VGraple API')+flag(d.automation.templateConfigured,'Template')+flag(d.automation.hmacConfigured,'Signed webhook')+'</div><div class="meta" style="margin-top:10px">Mode: FAIL-CLOSED — any contact/conversation/phone mismatch is blocked instead of sent.</div></div><h2>Follow-up due now</h2><div>'+(d.due.length?d.due.map(x=>row(x,true)).join(''):'<div class="empty">No follow-up is due right now.</div>')+'</div><h2>Still waiting</h2><div>'+(d.waiting.length?d.waiting.map(x=>row(x,false)).join(''):'<div class="empty">No leads are currently waiting.</div>')+'</div>'+(d.review.length?'<h2>Needs review</h2><div>'+d.review.map(x=>'<div class="row"><div><div class="name">'+esc(x.name)+'</div><div class="meta">'+esc(x.autoReason||'Identity/context check failed')+'</div></div></div>').join('')+'</div>':'')+'<div class="health"><b>Webhook health</b><div class="healthgrid"><div><div class="k">Last delivery</div><div class="hv">'+(d.health.lastDeliveryAt?new Date(d.health.lastDeliveryAt).toLocaleString():'None yet')+'</div></div><div><div class="k">Last event</div><div class="hv">'+esc(d.health.lastEventType||'—')+'</div></div><div><div class="k">Accepted</div><div class="hv">'+(d.health.accepted||0)+'</div></div><div><div class="k">Unknown</div><div class="hv">'+(d.health.unknown||0)+'</div></div></div></div><div class="small">48-hour rule · full conversation re-check before any automated template send</div></div>';document.getElementById('refresh').onclick=render}catch(e){app.innerHTML='<div class="wrap"><div class="empty">Could not load follow-up data.</div></div>'}}render();setInterval(()=>{if(key)render()},60000);
</script></body></html>
