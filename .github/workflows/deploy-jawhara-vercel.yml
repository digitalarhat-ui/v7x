name: Deploy Jawhara to Vercel v7x
on:
  push:
    branches: [main]
    paths:
      - 'jawhara/**'
      - '.github/workflows/deploy-jawhara-vercel.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Require Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN repository secret is not configured"
            exit 1
          fi
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Link v7x
        working-directory: jawhara
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel link --yes --project v7x --scope digitalarhat-9177s-projects --token "$VERCEL_TOKEN"
      - name: Deploy production
        id: deploy
        working-directory: jawhara
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL=$(vercel deploy --prod --yes --scope digitalarhat-9177s-projects --token "$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "DEPLOYMENT_URL=$URL" >> "$GITHUB_ENV"
      - name: Disable Vercel Authentication for v7x
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel project protection disable v7x --sso --scope digitalarhat-9177s-projects --token "$VERCEL_TOKEN" || true
      - name: Verify deployment
        run: |
          echo "Deployment: $DEPLOYMENT_URL"
          curl -I -L --fail --max-time 30 "$DEPLOYMENT_URL"
