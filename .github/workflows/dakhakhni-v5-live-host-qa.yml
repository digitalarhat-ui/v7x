name: Dakhakhni V5 Live Host QA
on:
  push:
    branches: [dakhakhni-v5-final]
    paths:
      - '.github/workflows/dakhakhni-v5-live-host-qa.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Validate published Lovable host
        run: |
          cat > live.mjs <<'EOF'
          import {chromium} from 'playwright'; import fs from 'fs';
          fs.mkdirSync('live-host-qa',{recursive:true});
          const url='https://dakhakhni-kitchen-demo.lovable.app/';
          const result={status:'PASS',checks:{},viewports:{},errors:[]};
          async function check(name,width,height){
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width,height},deviceScaleFactor:1,reducedMotion:'reduce'});
            const page=await context.newPage(); page.setDefaultTimeout(20000);
            const errs=[];page.on('pageerror',e=>errs.push('page:'+e.message));page.on('console',m=>{if(m.type()==='error')errs.push('console:'+m.text())});
            await page.goto(url,{waitUntil:'networkidle',timeout:60000});
            await page.waitForSelector('#heroCanvas',{timeout:30000});
            await page.waitForTimeout(1500);
            const data=await page.evaluate(()=>({
              title:document.title,
              dir:document.documentElement.dir,
              width:innerWidth,
              scrollWidth:document.documentElement.scrollWidth,
              heroText:document.querySelector('.hero')?.innerText||'',
              heroCanvas:document.querySelector('#heroCanvas')?.getBoundingClientRect().toJSON(),
              mount:!!document.querySelector('#dakhakhniV5'),
              bottomVisible:getComputedStyle(document.querySelector('.bottomNav')).visibility,
              three:!!window.THREE
            }));
            await page.screenshot({path:'live-host-qa/'+name+'-hero.png',fullPage:false});
            if(data.title!=='دخاخني | ابدأ مشروع مطبخك')throw new Error(name+' title mismatch');
            if(data.dir!=='rtl')throw new Error(name+' RTL missing');
            if(!data.mount||!data.three)throw new Error(name+' app/Three missing');
            if(!data.heroText.includes('رتّب مشروع مطبخك'))throw new Error(name+' hero copy missing');
            if(!data.heroCanvas||data.heroCanvas.width<250||data.heroCanvas.height<250)throw new Error(name+' hero 3D canvas too small');
            if(data.scrollWidth>width+1)throw new Error(name+' horizontal overflow');
            if(errs.length)throw new Error(name+' runtime errors: '+errs.join(' | '));
            result.viewports[name]={...data,errs};
            await browser.close();
          }
          try{
            await check('desktop-1440',1440,1000);
            await check('mobile-430',430,900);
            await check('mobile-390',390,844);
          }catch(e){result.status='FAIL';result.errors.push(e.stack||String(e));}
          fs.writeFileSync('live-host-qa/results.json',JSON.stringify(result,null,2));
          if(result.status!=='PASS')process.exitCode=1;
          EOF
          node live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dakhakhni-v5-live-host-qa
          path: live-host-qa
          if-no-files-found: error
          retention-days: 2
