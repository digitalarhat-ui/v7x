name: Lamsat Al Bayan V5 430 System Chrome QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lamsat-al-bayan-v5-430-system-chrome.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --no-save playwright-core@1.55.0
      - name: Find system Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
      - name: Full 430 production journey
        run: |
          cat > q430sys.mjs <<'EOF'
          import { chromium } from 'playwright-core';
          const url='https://headless-ckkxrasdkwe-digitalarhat-140c.wix-site-host.com/';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-dev-shm-usage']});
          const ctx=await browser.newContext({viewport:{width:430,height:932},isMobile:true,hasTouch:true,reducedMotion:'reduce'});
          const p=await ctx.newPage(); p.setDefaultTimeout(28000);
          const errors=[]; p.on('pageerror',e=>errors.push(e.message));
          await p.goto(url,{waitUntil:'domcontentloaded',timeout:50000});
          await p.waitForSelector('#lamsatAlBayanV5 .hero',{timeout:35000});
          await p.waitForSelector('#heroCanvas',{timeout:35000});
          await p.waitForTimeout(1000);
          const base=await p.evaluate(()=>({
            title:document.title,
            dir:document.documentElement.dir,
            stages:document.querySelectorAll('[data-stage]').length,
            layouts:[...document.querySelectorAll('[data-layout]')].map(e=>e.dataset.layout),
            gallery:[...document.querySelectorAll('.lamsatRealWork img')].map(i=>({complete:i.complete,w:i.naturalWidth})),
            overflow:document.documentElement.scrollWidth>innerWidth+1,
            foreign:(document.body.innerText||'').includes('دخاخني'),
            canvas:document.querySelector('#heroCanvas')?.getBoundingClientRect().toJSON()
          }));
          if(base.title!=='لمسة البيان | استوديو مشروع المطبخ'||base.dir!=='rtl'||base.stages!==5||base.overflow||base.foreign) throw Error('base '+JSON.stringify(base));
          for(const k of ['l','u','parallel','island']) if(!base.layouts.includes(k)) throw Error('layout '+k);
          if(base.gallery.length!==3||base.gallery.some(i=>!i.complete||i.w<100)) throw Error('gallery '+JSON.stringify(base.gallery));
          if(!base.canvas||base.canvas.width<250) throw Error('hero canvas');

          await p.click('#heroStart');
          await p.click('[data-projecttype="new"]');
          await p.click('[data-layout="l"]');
          await p.click('[data-measuremode="known"]');
          await p.fill('#roomLength','420'); await p.fill('#roomWidth','320');
          await p.click('#nextBtn');
          await p.waitForFunction(()=>document.body.dataset.phase==='2');
          await p.waitForSelector('#studioCanvas');
          await p.waitForTimeout(700);

          const studio=await p.evaluate(()=>({
            rect:document.querySelector('#studioCanvas')?.getBoundingClientRect().toJSON(),
            overflow:document.documentElement.scrollWidth>innerWidth+1,
            nextVisible:(()=>{const e=document.querySelector('#nextBtn');const r=e?.getBoundingClientRect();const s=e?getComputedStyle(e):null;return !!e&&!!r&&r.width>0&&r.height>0&&s.visibility!=='hidden'&&s.display!=='none'&&Number(s.opacity)>0;})()
          }));
          if(!studio.rect||studio.rect.width<250||studio.rect.height<220||studio.overflow||!studio.nextVisible) throw Error('studio '+JSON.stringify(studio));

          const oak=p.locator('[data-cabinet="oak"]').last(); if(await oak.count()) await oak.click();
          const warm=p.locator('[data-worktop="warm"]').last(); if(await warm.count()) await warm.click();
          const afterMaterial=await p.evaluate(()=>({
            nextVisible:(()=>{const e=document.querySelector('#nextBtn');const r=e?.getBoundingClientRect();const s=e?getComputedStyle(e):null;return !!e&&!!r&&r.width>0&&r.height>0&&s.visibility!=='hidden'&&s.display!=='none'&&Number(s.opacity)>0;})(),
            phase:document.body.dataset.phase
          }));
          if(!afterMaterial.nextVisible||afterMaterial.phase!=='2') throw Error('nav after material '+JSON.stringify(afterMaterial));

          await p.click('#nextBtn'); await p.waitForFunction(()=>document.body.dataset.phase==='3');
          await p.click('#nextBtn'); await p.waitForFunction(()=>document.body.dataset.phase==='4');
          await p.click('#nextBtn'); await p.waitForFunction(()=>document.body.dataset.phase==='5');

          const final=await p.evaluate(()=>({
            phase:document.body.dataset.phase,
            wa:document.querySelector('#waButton')?.href||'',
            preview:document.querySelector('#waPreview')?.textContent||'',
            overflow:document.documentElement.scrollWidth>innerWidth+1,
            foreign:(document.body.innerText||'').includes('دخاخني')
          }));
          if(final.phase!=='5'||!final.wa.includes('966541537978')||!final.preview.includes('حرف L')||!final.preview.includes('لمسة البيان')||final.overflow||final.foreign) throw Error('final '+JSON.stringify(final));
          if(errors.length) throw Error('runtime '+errors.join(' | '));
          console.log(JSON.stringify({PASS:true,base,studio,afterMaterial,final:{...final,wa:final.wa.slice(0,140)+'…',preview:final.preview.slice(0,420)}},null,2));
          await browser.close();
          EOF
          node q430sys.mjs
