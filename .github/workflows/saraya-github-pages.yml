name: Publish Al Saraya protected-source-derived venue preview on public GitHub Pages
on:
  push:
    branches:
      - qa/saraya-al-ahsa-20261010
    paths:
      - .github/workflows/saraya-github-pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: saraya-gh-pages
  cancel-in-progress: false
jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check existing Pages configuration; create if permitted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/pages-get.json -w '%{http_code}' -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${{ github.repository }}/pages")
          echo "Existing Pages status=$status"
          if [[ "$status" == "404" ]]; then
            code=$(curl -sS -o /tmp/pages-create.json -w '%{http_code}' -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' -d '{"build_type":"workflow"}' "https://api.github.com/repos/${{ github.repository }}/pages")
            echo "Create Pages status=$code"
            if [[ "$code" != "201" && "$code" != "409" ]]; then cat /tmp/pages-create.json; exit 1; fi
          elif [[ "$status" != "200" ]]; then cat /tmp/pages-get.json; exit 1; fi
      - name: Recover current served Golden-derived Saraya site, patch real event images and Pages prefix
        run: |
          set -euo pipefail
          mkdir -p /tmp/saraya-site/review
          base='https://saraya-al-ahsa-visual-planner.vercel.app'
          curl -fLsS "$base/" -o /tmp/saraya-site/index.html
          curl -fLsS "$base/review/" -o /tmp/saraya-site/review/index.html
          curl -fLsS "$base/wr-bilingual.js" -o /tmp/saraya-site/wr-bilingual.js
          curl -fLsS "$base/wr-bilingual.css" -o /tmp/saraya-site/wr-bilingual.css
          python3 - <<'PY'
          from pathlib import Path
          d=Path('/tmp/saraya-site')
          a=d/'index.html'; t=a.read_text()
          pairs={
          'https://venuewise.com/upload/venue/gallery/2025/08/04/2025_08_04_07_56_46_68903d3a12064.jpg':'https://wahhnews.com/wp-content/uploads/2026/09/5ea7eab3-605e-4ed9-bdbb-2d2bfb19a45a.jpg',
          'https://venuewise.com/upload/venue/gallery/2025/08/04/2025_08_04_07_50_11_68903cc7a806f.jpg':'https://wahhnews.com/wp-content/uploads/2026/09/55f0bd46-4067-4f45-a92d-1c40c3ccdff2.jpg'
          }
          for old,new in pairs.items():
            assert t.count(old)>=1,old
            t=t.replace(old,new)
          t=t.replace('href="/wr-bilingual.css"','href="/v7x/wr-bilingual.css"')
          t=t.replace('src="/wr-bilingual.js"','src="/v7x/wr-bilingual.js"')
          a.write_text(t)
          a=d/'review/index.html';t=a.read_text()
          t=t.replace('href="/wr-bilingual.css"','href="/v7x/wr-bilingual.css"').replace('src="/wr-bilingual.js"','src="/v7x/wr-bilingual.js"')
          t=t.replace('href="/"','href="/v7x/"')
          a.write_text(t)
          a=d/'wr-bilingual.js';t=a.read_text()
          t=t.replace('location.pathname.startsWith("/review")','location.pathname.includes("/review")')
          t=t.replace('a[href="/"],a[href="/review/"]','a[href="/v7x/"],a[href="/v7x/review/"]')
          a.write_text(t)
          for path in ['index.html','review/index.html','wr-bilingual.js']:
            content=(d/path).read_text()
            assert 'الوردة البيضاء' not in content and 'White Rose' not in content
            assert 'saraya' in content.lower() or 'السرايا' in content
          assert 'wahhnews.com' in (d/'index.html').read_text()
          (d/'.nojekyll').write_text('')
          (d/'robots.txt').write_text('User-agent: *\nDisallow: /\n')
          (d/'BUILD-MANIFEST.txt').write_text('SA-3F-20261010-SARAYA-ALAHSA; White Rose Golden-derived static planner; two 2026 hall event photo hotlinks externally attributed to wahhnews.com; OWNER_ATTESTED_MEDIA_PERMISSION=YES, independent image rights unverified. Unofficial non-endorsed concept; no backend or booking.\n')
          PY
          cd /tmp/saraya-site && sha256sum index.html review/index.html wr-bilingual.js wr-bilingual.css > SHA256SUMS.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/saraya-site
      - id: deployment
        uses: actions/deploy-pages@v4
