name: EWAA White Rose concept QA
on:
  push:
    branches:
      - ewaa-riyadh-white-rose-20261015
    paths:
      - 'ewaa-riyadh-white-rose/**'
      - '.github/workflows/ewaa-white-rose-qa.yml'
  workflow_dispatch:
jobs:
  browser-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install free browser runner
        run: |
          npm install --prefix /tmp/ewaa-qa --no-save playwright@1.56.1
          /tmp/ewaa-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Serve static concept
        run: |
          python3 -m http.server 8765 --directory ewaa-riyadh-white-rose > /tmp/ewaa-http.log 2>&1 &
          sleep 3
      - name: Browser QA at all requested widths, Arabic and English
        env:
          NODE_PATH: /tmp/ewaa-qa/node_modules
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const issues=[],imgs={};
            for(const width of [390,430,768,1440]){
              const page=await browser.newPage({viewport:{width,height:850},deviceScaleFactor:1});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:8765/index.html',{waitUntil:'domcontentloaded'});
              await page.waitForTimeout(2800);
              const head=await page.locator('h1').first().innerText();
              if(!head.includes('المناسبة'))issues.push(width+': Arabic hero missing');
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+2);
              if(overflow)issues.push(width+': horizontal overflow');
              const im=await page.locator('.venuePhoto img').evaluateAll(nodes=>nodes.map(n=>({src:n.src,loaded:n.complete&&n.naturalWidth>0,width:n.naturalWidth})));
              imgs[width]=im;
              if(im.filter(x=>x.loaded).length<2)issues.push(width+': venue photographs did not both decode');
              await page.locator('#eventDate').fill('2026-12-05');
              await page.locator('#guestCount').fill('90');
              if(!await page.locator('#validation').innerText().then(x=>x.includes('80')))issues.push(width+': capacity warning missing');
              await page.locator('#venueSelect').selectOption('grand');
              if(!await page.locator('#validation').innerText().then(x=>x.includes('80')))issues.push(width+': grand capacity warning missing');
              await page.locator('#venueSelect').selectOption('ewaa');
              await page.locator('#langBtn').click();
              const dir=await page.evaluate(()=>document.documentElement.dir);
              if(dir!=='ltr')issues.push(width+': LTR missing');
              if(!(await page.locator('h1').first().innerText()).includes('event'))issues.push(width+': English hero missing');
              if(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+2))issues.push(width+': English overflow');
              await page.locator('#reviewBtn').click();
              await page.waitForURL(/review\/index\.html#brief=/);
              if(!(await page.locator('#title').innerText()).includes('review'))issues.push(width+': review translation missing');
              await page.locator('#approve').click();
              const status=await page.locator('#status').innerText();
              if(!status.includes('Simulated'))issues.push(width+': review interaction missing');
              issues.push(...errors.map(e=>width+': JS: '+e));
              console.log('WIDTH',width,'PHOTO',im.map(i=>i.loaded+'/'+i.width).join(','),'status',status);
              await page.close();
            }
            await browser.close();
            console.log('ISSUES',JSON.stringify(issues));
            if(issues.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)})
          NODE
      - name: Verify immutable public owner preview and review routes
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          set -e
          BASE="https://cdn.githubraw.com/digitalarhat-ui/v7x/$GIT_SHA/ewaa-riyadh-white-rose"
          echo "Testing $BASE"
          curl --retry 3 --retry-delay 2 --max-time 45 -fLso /tmp/ewaa-live.html "$BASE/index.html"
          curl --retry 3 --retry-delay 2 --max-time 45 -fLso /tmp/ewaa-review.html "$BASE/review/index.html"
          grep -q 'EWAA · CONCEPT STUDIO' /tmp/ewaa-live.html
          grep -q 'EWAA · Review concept' /tmp/ewaa-review.html
          echo "PUBLIC_ORIGIN_GET_PASS main_and_review"
      - name: Public origin four-width bilingual QA and visual snapshots
        env:
          NODE_PATH: /tmp/ewaa-qa/node_modules
          GIT_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const url="https://cdn.githubraw.com/digitalarhat-ui/v7x/"+process.env.GIT_SHA+"/ewaa-riyadh-white-rose/index.html";
            const issues=[];
            for(const width of [390,430,768,1440]){
              const page=await browser.newPage({viewport:{width,height:900},deviceScaleFactor:1});
              const errors=[];page.on("pageerror",e=>errors.push(e.message));
              const resp=await page.goto(url,{waitUntil:"domcontentloaded",timeout:60000});
              await page.waitForTimeout(2200);
              const images=await page.locator(".venuePhoto img").evaluateAll(n=>n.map(x=>x.complete&&x.naturalWidth>0));
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+2);
              if(resp.status()!==200)issues.push(width+": HTTP "+resp.status());
              if(images.filter(Boolean).length<2)issues.push(width+": photo decode "+images);
              if(overflow)issues.push(width+": AR horizontal overflow");
              if([430,1440].includes(width)){
                const shot=(await page.screenshot({type:"jpeg",quality:47,fullPage:false})).toString("base64");
                console.log("VISUAL_SHOT_AR_"+width+"="+shot);
              }
              if(width===430){
                await page.evaluate(()=>document.getElementById("venues").scrollIntoView({block:"start"}));
                await page.waitForTimeout(450);
                console.log("VISUAL_SHOT_VENUES_430="+(await page.screenshot({type:"jpeg",quality:47,fullPage:false})).toString("base64"));
                await page.evaluate(()=>document.getElementById("studio").scrollIntoView({block:"start"}));
                await page.waitForTimeout(450);
                console.log("VISUAL_SHOT_STUDIO_430="+(await page.screenshot({type:"jpeg",quality:47,fullPage:false})).toString("base64"));
              }
              await page.locator("#eventDate").fill("2026-12-05");
              await page.locator("#guestCount").fill("90");
              const w=await page.locator("#validation").innerText();
              if(!w.includes("80"))issues.push(width+": Ewaa capacity caveat absent");
              await page.locator("#venueSelect").selectOption("grand");
              const w2=await page.locator("#validation").innerText();
              if(!w2.includes("80"))issues.push(width+": Grand Plaza 80-guest limit absent");
              await page.locator("#venueSelect").selectOption("ewaa");
              await page.locator("#langBtn").click();
              if(await page.evaluate(()=>document.documentElement.dir)!=="ltr")issues.push(width+": English dir");
              if(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+2))issues.push(width+": EN overflow");
              if(width===430){
                const shot=(await page.screenshot({type:"jpeg",quality:47,fullPage:false})).toString("base64");
                console.log("VISUAL_SHOT_EN_"+width+"="+shot);
              }
              await page.locator("#reviewBtn").click();
              await page.waitForURL(/review\/index\.html#brief=/,{timeout:15000});
              if(!await page.locator("#approve").isVisible())issues.push(width+": /review unavailable");
              await page.locator("#approve").click();
              if(!await page.locator("#status").innerText().then(x=>x.includes("Simulated")))issues.push(width+": /review simulation not interactive");
              if(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+2))issues.push(width+": review overflow");
              issues.push(...errors.map(e=>width+": JS "+e));
              console.log("PUBLIC_WIDTH_PASS",width,"PHOTOS",images.join(","),"REVIEW",true);
              await page.close();
            }
            console.log("PUBLIC_QA_ISSUES",JSON.stringify(issues));
            await browser.close();
            if(issues.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)})
          NODE
