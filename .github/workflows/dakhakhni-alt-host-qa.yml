name: Dakhakhni Alternate Host QA
on:
  push:
    branches: [dakhakhni-alt-host-qa]
    paths:
      - '.github/workflows/dakhakhni-alt-host-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dakhakhni-alt-host-qa
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Verify Wix alternate production host
        run: |
          cat > altqa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          fs.mkdirSync('alt-host-qa',{recursive:true});
          const url='https://headless-hcvqlgycuzi-digitalarhat-140c.wix-site-host.com/';
          const expected='c4457536fd1d974ea30d6e97179a890f9fb39145';
          const result={status:'PASS',url,expected,viewports:{},errors:[]};
          async function run(name,width,height){
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width,height},deviceScaleFactor:1,reducedMotion:'reduce',hasTouch:width<=430,isMobile:width<=430});
            const page=await context.newPage();
            page.setDefaultTimeout(25000);
            const errs=[];
            page.on('pageerror',e=>errs.push('page:'+e.message));
            page.on('console',m=>{if(m.type()==='error')errs.push('console:'+m.text())});
            const response=await page.goto(url,{waitUntil:'networkidle',timeout:60000});
            if(!response||response.status()!==200) throw new Error(name+' HTTP '+(response&&response.status()));
            await page.waitForSelector('#heroCanvas',{timeout:30000});
            await page.waitForTimeout(1200);

            const initial=await page.evaluate((expected)=>({
              title:document.title,
              dir:document.documentElement.dir,
              iw:innerWidth,
              sw:document.documentElement.scrollWidth,
              heroText:document.querySelector('.hero')?.innerText||'',
              canvas:document.querySelector('#heroCanvas')?.getBoundingClientRect().toJSON(),
              coreResources:performance.getEntriesByType('resource').map(x=>x.name).filter(x=>x.includes('kitchen-engine-v5/core.')||x.includes('/configs/dakhakhni.js')),
              hasExpectedAsset:[...performance.getEntriesByType('resource')].some(x=>x.name.includes('@'+expected+'/kitchen-engine-v5/core.js')),
              hostContamination:[...document.querySelectorAll('body *')].filter(el=>/lovable|replit|netlify/i.test(((el.textContent||'')+' '+((el.getAttribute&&el.getAttribute('href'))||'')))).filter(el=>getComputedStyle(el).display!=='none'&&getComputedStyle(el).visibility!=='hidden').map(el=>el.outerHTML.slice(0,300))
            }),expected);
            if(initial.title!=='دخاخني | ابدأ مشروع مطبخك') throw new Error(name+' title mismatch');
            if(initial.dir!=='rtl') throw new Error(name+' RTL missing');
            if(initial.sw>width+1) throw new Error(name+' horizontal overflow at hero');
            if(!initial.heroText.includes('رتّب مشروع مطبخك')) throw new Error(name+' hero copy missing');
            if(!initial.canvas||initial.canvas.width<250||initial.canvas.height<220) throw new Error(name+' hero canvas too small');
            if(!initial.hasExpectedAsset) throw new Error(name+' exact source SHA core.js not loaded');
            if(initial.hostContamination.length) throw new Error(name+' visible host-platform contamination');

            await page.screenshot({path:'alt-host-qa/'+name+'-hero.png',fullPage:false});

            await page.locator('#heroStart').click();
            await page.locator('[data-projecttype="new"]').click();
            await page.locator('[data-layout="l"]').click();
            await page.locator('[data-measuremode="known"]').click();
            await page.locator('#roomLength').fill('420');
            await page.locator('#roomWidth').fill('320');
            await page.locator('#nextBtn').click();
            await page.waitForSelector('.stage[data-stage="2"].active');
            await page.waitForTimeout(700);
            await page.screenshot({path:'alt-host-qa/'+name+'-phase2.png',fullPage:false});

            await page.locator('#nextBtn').click();
            await page.waitForSelector('.stage[data-stage="3"].active');
            await page.locator('#nextBtn').click();
            await page.waitForSelector('.stage[data-stage="4"].active');
            await page.locator('#nextBtn').click();
            await page.waitForSelector('.stage[data-stage="5"].active');

            await page.locator('#customerName').fill('عميل تجريبي');
            await page.locator('#city').fill('ينبع');
            await page.locator('#projectNote').fill('أولوية للتخزين ومساحة التحضير');
            await page.waitForTimeout(250);
            const final=await page.evaluate(()=>({
              sw:document.documentElement.scrollWidth,
              wa:document.querySelector('#waButton')?.getAttribute('href')||'',
              preview:document.querySelector('#waPreview')?.innerText||'',
              copy:document.querySelector('#copyBrief')?.innerText||'',
              share:!!document.querySelector('#shareProject'),
              stage:document.body.dataset.phase,
              minTouch:Math.min(...[...document.querySelectorAll('button,a,input,summary')].filter(el=>el.offsetParent!==null).map(el=>Math.min(el.getBoundingClientRect().width,el.getBoundingClientRect().height)).filter(v=>Number.isFinite(v)&&v>0))
            }));
            if(final.sw>width+1) throw new Error(name+' horizontal overflow at phase5');
            if(!final.wa.startsWith('https://wa.me/966545246478?text=')) throw new Error(name+' WhatsApp route mismatch');
            if(!final.preview.includes('طلب مطبخ مبدئي — دخاخني')) throw new Error(name+' canonical WhatsApp preview missing');
            if(!final.preview.includes('420 × 320')) throw new Error(name+' dimensions missing from brief');
            if(final.copy!=='نسخ ملخص المشروع') throw new Error(name+' canonical copy action missing');
            if(!final.share) throw new Error(name+' share action missing');
            if(final.stage!=='5') throw new Error(name+' did not reach phase 5');
            if(errs.length) throw new Error(name+' runtime errors: '+errs.join(' | '));

            await page.screenshot({path:'alt-host-qa/'+name+'-phase5.png',fullPage:false});
            result.viewports[name]={initial,final,errs};
            await browser.close();
          }
          try{
            await run('mobile-390',390,844);
            await run('mobile-430',430,932);
            await run('desktop-1440',1440,1000);
          }catch(e){
            result.status='FAIL';
            result.errors.push(e.stack||String(e));
          }
          fs.writeFileSync('alt-host-qa/results.json',JSON.stringify(result,null,2));
          if(result.status!=='PASS') process.exitCode=1;
          EOF
          node altqa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dakhakhni-alt-host-qa
          path: alt-host-qa
          if-no-files-found: error
          retention-days: 2
      - name: Store compact QA result
        if: always()
        run: |
          rm -rf alt-host-qa-output
          mkdir -p alt-host-qa-output
          cp alt-host-qa/results.json alt-host-qa-output/results.json || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alt-host-qa-output
          git commit -m "Store Dakhakhni alternate host QA" || true
          git push origin HEAD:dakhakhni-alt-host-qa
