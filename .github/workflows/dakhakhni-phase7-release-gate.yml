name: Dakhakhni Phase 7 Release Gate
on:
  push:
    branches: [dakhakhni-phase7-release-gate]
    paths: ['.github/workflows/dakhakhni-phase7-release-gate.yml']
permissions:
  contents: read
concurrency:
  group: dakhakhni-phase7-release-gate
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Frozen source integrity
        run: |
          git diff --exit-code c4457536fd1d974ea30d6e97179a890f9fb39145 -- dakhakhni-kitchen-v5 kitchen-engine-v5
          node --check kitchen-engine-v5/core.js
          ! grep -RniE 'FN Cadena|Makan Cars|Higher Class|Roaa' dakhakhni-kitchen-v5 kitchen-engine-v5 --exclude='*.map'
          grep -q '966545246478' kitchen-engine-v5/configs/dakhakhni.js
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start source server
        run: |
          python3 -m http.server 4180 --bind 127.0.0.1 >/tmp/p7.log 2>&1 &
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:4180/dakhakhni-kitchen-v5/ >/dev/null && exit 0; sleep .2; done
          exit 1
      - name: Deterministic P0 P1 release gate
        run: |
          cat > p7.mjs <<'EOF'
          import {chromium} from 'playwright';
          import fs from 'fs';import crypto from 'crypto';
          const base='http://127.0.0.1:4180/dakhakhni-kitchen-v5/',out='qa-phase7';fs.mkdirSync(out,{recursive:true});
          const result={status:'PASS',viewports:{},assets:{},errors:[],screenshots:[]};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms)),hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          async function state(p){return p.evaluate(()=>JSON.parse(localStorage.getItem('dakhakhni:v5:project')||'null'))}
          async function shot(p,n){await p.screenshot({path:out+'/'+n+'.png',animations:'disabled'});result.screenshots.push(n+'.png')}
          async function orbit(p,sel){const b=await p.locator(sel).boundingBox();if(!b)return false;const a=hash(await p.locator(sel).screenshot()),x=b.x+b.width*.46,y=b.y+b.height*.5;await p.evaluate(({sel,x,y})=>{const c=document.querySelector(sel);for(const [t,dx,dy] of [['pointerdown',0,0],['pointermove',88,3],['pointerup',88,3]])c.dispatchEvent(new PointerEvent(t,{pointerId:9,pointerType:'touch',clientX:x+dx,clientY:y+dy,bubbles:true,cancelable:true}))},{sel,x,y});await sleep(180);return a!==hash(await p.locator(sel).screenshot())}
          async function go(p,phase){await p.locator('#nextBtn').click({force:true});await p.waitForSelector('.stage[data-stage="'+phase+'"].active')}
          async function one(width,height){
            const browser=await chromium.launch({headless:true,args:['--enable-unsafe-swiftshader','--ignore-gpu-blocklist']});
            const context=await browser.newContext({viewport:{width,height},deviceScaleFactor:1,reducedMotion:'reduce',hasTouch:width<700,isMobile:width<700,permissions:['clipboard-read','clipboard-write']});
            const p=await context.newPage(),errs=[];p.on('pageerror',e=>errs.push(e.message));p.on('console',m=>{if(m.type()==='error')errs.push(m.text())});await p.addInitScript(()=>localStorage.clear());await p.goto(base,{waitUntil:'domcontentloaded'});await p.waitForSelector('#heroCanvas');await sleep(500);
            const tag=String(width),hero=await p.locator('.hero').innerText();if(!hero.includes('ابدأ مشروعك')||!hero.includes('3D مباشر')||/QA|V5|PMREM|GLB|Three\.js|debug/i.test(hero))throw new Error(tag+' hero gate');
            if(!(await orbit(p,'#heroCanvas')))throw new Error(tag+' hero orbit');await shot(p,tag+'-01-hero');
            for(const k of ['ivory','oak','graphite']){await p.locator('[data-cabinet="'+k+'"]').click({force:true});if((await state(p)).visual.cabinet!==k)throw new Error(tag+' cabinet '+k)}
            for(const k of ['veined','warm','dark']){await p.locator('[data-worktop="'+k+'"]').click({force:true});if((await state(p)).visual.worktop!==k)throw new Error(tag+' worktop '+k)}
            await p.locator('[data-cabinet="oak"]').click({force:true});await p.locator('[data-worktop="veined"]').click({force:true});
            await p.locator('#heroStart').click({force:true});await p.locator('[data-projecttype="new"]').click({force:true});await p.locator('[data-layout="l"]').click({force:true});await p.locator('[data-measuremode="known"]').click({force:true});
            await p.locator('#roomLength').fill('420');await p.locator('#roomLength').dispatchEvent('input');await p.locator('#roomWidth').fill('320');await p.locator('#roomWidth').dispatchEvent('input');await p.locator('.optionalDetails summary').click();await p.locator('#roomHeight').fill('280');await p.locator('#roomHeight').dispatchEvent('input');await shot(p,tag+'-02-phase1');await go(p,2);
            if((await state(p)).visual.cabinet!=='oak')throw new Error(tag+' hero studio continuity');if(!(await orbit(p,'#studioCanvas')))throw new Error(tag+' studio orbit');
            await p.locator('[data-configtab="modules"]').focus();await p.locator('[data-configtab="modules"]').press('Enter');await p.waitForFunction(()=>JSON.parse(localStorage.getItem('dakhakhni:v5:project')||'{}').config?.activeTab==='modules');
            await p.locator('[data-configslot="base:0"]').click({force:true});const before=(await state(p)).config.baseSlots[0],repl=before==='drawers'?'doors':'drawers';await p.locator('[data-configreplace="'+repl+'"]').click({force:true});if((await state(p)).config.baseSlots[0]!==repl)throw new Error(tag+' config replace');await p.locator('#undoConfig').click({force:true});if((await state(p)).config.baseSlots[0]!==before)throw new Error(tag+' undo');await shot(p,tag+'-03-phase2');await go(p,3);
            await p.locator('[data-userchoice="3-4"]').click({force:true});await p.locator('[data-cookingchoice="daily"]').click({force:true});
            const apps=p.locator('[data-reqgroup="appliances"]');await apps.locator('summary').click();for(const k of ['fridge','oven']){let s=await state(p);if(!s.details.appliances[k])await p.locator('[data-appliance="'+k+'"]').click({force:true})}
            await shot(p,tag+'-04-phase3');await go(p,4);await shot(p,tag+'-05-phase4');await go(p,5);
            await p.locator('#customerName').fill('عميل تجريبي');await p.locator('#city').fill('ينبع');await p.locator('#projectNote').fill('أولوية للتخزين ومساحة التحضير');await sleep(100);
            const wa=(await p.locator('#waPreview').innerText()).trim(),href=await p.locator('#waButton').getAttribute('href'),lines=wa.split('\n').filter(Boolean),body=await p.locator('body').innerText();
            if(lines.length<10||lines.length>16||!href?.startsWith('https://wa.me/966545246478?text='))throw new Error(tag+' WhatsApp gate');
            if(/slot_|customer_selected|prototype_default|FN Cadena|Makan Cars|Higher Class|Roaa|تصميم معتمد|خامة معتمدة|سعر نهائي|مدة مضمونة/i.test(body+wa))throw new Error(tag+' truth contamination gate');
            await p.locator('#shareProject').click({force:true});await sleep(80);const share=await p.evaluate(()=>navigator.clipboard.readText()),code=(await state(p)).meta.projectCode;if(!share.includes('?project='))throw new Error(tag+' share');
            const clean=await browser.newContext({viewport:{width,height},deviceScaleFactor:1,reducedMotion:'reduce'}),q=await clean.newPage();await q.goto(share,{waitUntil:'domcontentloaded'});await q.waitForSelector('.stage.active');await sleep(350);const restored=await state(q);if(restored.meta.projectCode!==code||restored.room.layout!=='l'||restored.room.length!==420||restored.visual.cabinet!=='oak'||restored.details.users!=='3-4'||q.url().includes('?project='))throw new Error(tag+' share restore');await clean.close();
            const m=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,iw:innerWidth,min:Math.min(...[...document.querySelectorAll('button,.waButton,.shareButton,.journeyEdit,.requirementGroup>summary')].filter(e=>e.offsetParent!==null).map(e=>e.getBoundingClientRect().height))}));if(m.sw>m.iw+1||m.min<44)throw new Error(tag+' layout '+JSON.stringify(m));if(errs.length)throw new Error(tag+' runtime '+errs.join('|'));await shot(p,tag+'-06-phase5');
            result.viewports[tag]={scrollWidth:m.sw,minTouch:m.min,whatsappLines:lines.length,shareRestore:true};await browser.close()
          }
          try{
            for(const u of ['/kitchen-engine-v5/core.js','/kitchen-engine-v5/core.css','/kitchen-engine-v5/configs/dakhakhni.js','/vendor/three-r128.min.js','/vendor/GLTFLoader-r128.js','/vendor/RGBELoader-r128.js','/kitchen-engine-v5/assets/kiara_interior_1k.hdr','/kitchen-engine-v5/assets/kitchen_tap.glb']){const r=await fetch('http://127.0.0.1:4180'+u);result.assets[u]=r.status;if(!r.ok)throw new Error('asset '+u+' '+r.status)}
            for(const [w,h] of [[390,844],[430,900],[1440,1000]])await one(w,h);
            for(const [w,h] of [[768,900],[1024,900]]){const b=await chromium.launch({headless:true});const c=await b.newContext({viewport:{width:w,height:h}}),p=await c.newPage();await p.goto(base);const m=await p.evaluate(()=>[document.documentElement.scrollWidth,innerWidth]);if(m[0]>m[1]+1)throw new Error(w+' overflow');await b.close()}
          }catch(e){result.status='FAIL';result.errors.push(e.stack||String(e))}
          fs.writeFileSync(out+'/results.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result,null,2));if(result.status!=='PASS')process.exit(1)
          EOF
          node p7.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dakhakhni-phase7-final-source-qa
          path: qa-phase7
          if-no-files-found: error
          retention-days: 3
