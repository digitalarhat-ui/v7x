name: Safwat V2.3 browser QA
on:
  push:
    branches:
      - qa/safwat-venue-v23-20261009
permissions:
  contents: read
jobs:
  safwat-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free Playwright runner dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test Safwat customer and management journeys in real Chromium
        run: node qa/safwat-browser-v23.mjs
      - name: Save browser screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safwat-v23-qa-screenshots-and-report
          path: |
            safwat-screens/
            safwat-qa-report.json
          retention-days: 3
