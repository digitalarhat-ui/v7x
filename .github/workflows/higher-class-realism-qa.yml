name: Higher Class Photorealism QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'qa-higher-class-trigger.txt'
      - '.github/workflows/higher-class-realism-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  realism-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out Higher Class rescue branch
        uses: actions/checkout@v4
        with:
          ref: higher-class-photorealism-rescue-v2
      - name: Prepare real Chrome QA
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 --silent
          python3 -m http.server 4173 > /tmp/hc-server.log 2>&1 &
          sleep 2
      - name: Run WebGL visual QA
        run: node qa/visual-qa.mjs before
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: higher-class-realism-before
          path: qa-artifacts/
          retention-days: 7
