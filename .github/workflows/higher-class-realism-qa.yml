name: Higher Class Photorealism QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/higher-class-realism-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  realism-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out Higher Class rescue branch
        uses: actions/checkout@v4
        with:
          ref: higher-class-photorealism-rescue-v2
          fetch-depth: 0
      - name: Prepare real Chrome QA
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 --silent
          python3 -m http.server 4173 > /tmp/hc-server.log 2>&1 &
          sleep 2
      - name: Run WebGL visual QA
        run: node qa/visual-qa.mjs after
      - name: Persist AFTER evidence to rescue branch
        if: always()
        run: |
          mkdir -p qa-evidence
          cp qa-artifacts/after-diagnostics.json qa-evidence/after-diagnostics.json 2>/dev/null || true
          for f in qa-artifacts/after-*.png; do
            [ -f "$f" ] || continue
            n=$(basename "$f")
            base64 -w0 "$f" > "qa-evidence/$n.b64"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa-evidence
          if ! git diff --cached --quiet; then
            git commit -m "Record Higher Class AFTER realism evidence"
            git push origin HEAD:higher-class-photorealism-rescue-v2
          fi
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: higher-class-realism-after
          path: qa-artifacts/
          retention-days: 7
