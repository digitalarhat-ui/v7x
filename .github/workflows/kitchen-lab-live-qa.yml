name: Kitchen Lab Riyadh V1.4 Live QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kitchen-lab-live-qa.yml'
      - 'kitchen-lab-v14/**'
      - 'vercel.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare live browser QA
        run: |
          mkdir -p /tmp/kitchen-lab-qa qa-kitchen-lab-live
          cd /tmp/kitchen-lab-qa
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24.19.0 --silent
          cat > qa.mjs <<'NODE'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';
          const live='https://kitchenlab-riyadh.vercel.app/';
          for(let i=0;i<24;i++){
            try{
              const r=await fetch(live,{redirect:'follow'});
              const t=await r.text();
              if(r.ok && t.includes('كيتشن لاب') && t.includes('الأمتار الطولية') && !t.includes('سمارت')) break;
            }catch{}
            if(i===23) throw new Error('Kitchen Lab alias did not become ready in time');
            await new Promise(r=>setTimeout(r,5000));
          }
          fs.writeFileSync('/tmp/kitchen-lab-qa/room.png',Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Z9mAAAAAASUVORK5CYII=','base64'));
          const browser=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--enable-webgl']});
          const sizes=[['390',390,844],['430',430,932],['1440',1440,900]];
          const out=[];
          for(const [name,w,h] of sizes){
            const p=await browser.newPage();
            await p.setViewport({width:w,height:h,deviceScaleFactor:1});
            const errors=[],badResponses=[];
            p.on('pageerror',e=>errors.push('page:'+String(e)));
            p.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
            p.on('response',r=>{if(r.status()>=400)badResponses.push(r.status()+' '+r.url())});
            const res=await p.goto(live,{waitUntil:'networkidle2',timeout:60000});
            await new Promise(r=>setTimeout(r,7000));
            const init=await p.evaluate(()=>({
              title:document.title,
              brand:document.querySelector('.brand')?.textContent?.trim()||'',
              wa:[...document.querySelectorAll('a[href*="wa.me"]')].map(x=>x.getAttribute('href')),
              canvas:[document.querySelector('#stage canvas')?.width||0,document.querySelector('#stage canvas')?.height||0],
              overflow:document.documentElement.scrollWidth-innerWidth,
              baseSwatches:document.querySelectorAll('.control-group[data-kind="baseColor"] .swatch').length,
              accentSwatches:document.querySelectorAll('.control-group[data-kind="accentColor"] .swatch').length,
              materialOptions:document.querySelectorAll('.control-group[data-kind="material"] .seg').length,
              tops:document.querySelectorAll('.control-group[data-kind="top"] .seg').length,
              forbidden:['سمارت','aluminumsmart.com','575576349','أفراح الحكمي','Afrah','Higher Class','النجوم الثلاثة','Digital Arhat','BEASTMODE','V1.4'].filter(x=>document.documentElement.innerHTML.includes(x)),
              galleryImages:[...document.querySelectorAll('#gallery img')].map(x=>({ok:x.complete&&x.naturalWidth>100,w:x.naturalWidth,h:x.naturalHeight})),
              fallbackDisplay:getComputedStyle(document.querySelector('#galleryFallback')).display
            }));
            if(!res||res.status()>=400)throw new Error(name+': HTTP '+(res?.status()||'none'));
            if(!init.title.includes('كيتشن لاب')||!init.brand.includes('كيتشن لاب'))throw new Error(name+': identity failed');
            if(!init.wa.some(x=>x&&x.startsWith('https://wa.me/966567173172')))throw new Error(name+': WhatsApp route mismatch '+JSON.stringify(init.wa));
            if(init.canvas[0]<100||init.canvas[1]<100)throw new Error(name+': WebGL failed '+JSON.stringify(init.canvas));
            if(init.overflow>2)throw new Error(name+': horizontal overflow '+init.overflow);
            if(init.baseSwatches<12||init.accentSwatches<12)throw new Error(name+': color depth '+JSON.stringify(init));
            if(init.materialOptions!==2)throw new Error(name+': material family count '+init.materialOptions);
            if(init.tops<4)throw new Error(name+': worktop depth '+init.tops);
            if(init.forbidden.length)throw new Error(name+': contamination '+JSON.stringify(init.forbidden));
            if(init.galleryImages.filter(x=>x.ok).length<2&&init.fallbackDisplay==='none')throw new Error(name+': authentic gallery needs two loaded first-party images or visible failsafe '+JSON.stringify(init.galleryImages));

            const before=await p.$eval('#currentChoice',el=>el.textContent);
            if(w<=560) await p.click('.control-tab[data-tab="colors"]');
            await p.click('.control-group[data-kind="baseColor"] .swatch[data-value="sage"]');
            await p.click('.control-group[data-kind="accentColor"] .swatch[data-value="navy"]');
            if(w<=560) await p.click('.control-tab[data-tab="surface"]');
            await p.click('.control-group[data-kind="top"] .seg[data-value="black"]');
            if(w<=560) await p.click('.control-tab[data-tab="lighting"]');
            await p.click('.control-group[data-kind="lighting"] .seg[data-value="evening"]');
            await new Promise(r=>setTimeout(r,300));
            const after=await p.$eval('#currentChoice',el=>el.textContent);
            if(after===before||!after.includes('سيج')||!after.includes('كحلي')||!after.includes('جرانيت داكن'))throw new Error(name+': 3D decision controls failed '+after);

            await p.click('#saveA');
            if(w<=560) await p.click('.control-tab[data-tab="colors"]');
            await p.click('.control-group[data-kind="baseColor"] .swatch[data-value="white"]');
            await p.click('#saveB');
            const ab=await p.evaluate(()=>({a:document.querySelector('#variantASummary')?.textContent||'',b:document.querySelector('#variantBSummary')?.textContent||'',imgA:!!document.querySelector('#variantAMedia img'),imgB:!!document.querySelector('#variantBMedia img')}));
            if(!ab.a||!ab.b||ab.a===ab.b||!ab.imgA||!ab.imgB)throw new Error(name+': A/B compare failed '+JSON.stringify(ab));

            await p.click('#advisorNext');await p.click('#advisorNext');await p.click('#advisorNext');await p.click('#advisorNext');
            const advisor=await p.evaluate(()=>({ready:document.querySelector('#advisorGrid')?.classList.contains('result-ready'),title:document.querySelector('#advisorTitle')?.textContent||''}));
            if(!advisor.ready||!advisor.title)throw new Error(name+': guided direction failed '+JSON.stringify(advisor));

            const roomInput=await p.$('#roomFile');
            await roomInput.uploadFile('/tmp/kitchen-lab-qa/room.png');
            await new Promise(r=>setTimeout(r,500));
            const room=await p.evaluate(()=>({ready:document.querySelector('#roomSide')?.classList.contains('ready'),applyEnabled:!document.querySelector('#applyRoomPalette')?.disabled,preview:!document.querySelector('#roomPreview')?.hidden}));
            if(!room.ready||!room.applyEnabled||!room.preview)throw new Error(name+': room palette module failed '+JSON.stringify(room));

            await p.click('#shareDesign');
            const shareUrl=await p.url();
            if(!shareUrl.includes('b=')||!shareUrl.includes('a=')||!shareUrl.includes('t='))throw new Error(name+': exact-state link failed '+shareUrl);

            await p.select('#projectTypeInput','مطبخ جديد');
            await p.type('#cityInput','الملقا');
            await p.select('#layoutInput','حرف L');
            await p.type('#lengthInput','4.8');
            await p.select('#accessoryInput','أحتاج ملحقات داخلية');
            await p.click('input[name="appliance"][value="غسالة صحون"]');
            await p.type('#noteInput','أرغب بمقارنة الاتجاهين قبل موعد القياس');
            await new Promise(r=>setTimeout(r,220));
            const req=await p.evaluate(()=>({summary:document.querySelector('#summary')?.textContent||'',score:document.querySelector('#readinessScore')?.textContent||'',handoff:document.querySelector('#handoffBtn')?.textContent||''}));
            for(const token of ['مطبخ جديد','الملقا','4.8','أحتاج ملحقات داخلية','غسالة صحون','كحلي','جرانيت داكن'])if(!req.summary.includes(token))throw new Error(name+': project brief lost '+token+' '+req.summary);
            if(!req.handoff.includes('واتساب'))throw new Error(name+': handoff CTA wrong '+req.handoff);

            await p.evaluate(()=>{window.__qaOpened='';window.open=(url)=>{window.__qaOpened=String(url);return null;};});
            await p.click('#handoffBtn');
            await new Promise(r=>setTimeout(r,120));
            const opened=await p.evaluate(()=>window.__qaOpened||'');
            if(!opened.startsWith('https://wa.me/966567173172?text=')||!decodeURIComponent(opened).includes('الأمتار الطولية'))throw new Error(name+': WhatsApp handoff failed '+opened);

            const meaningful=errors.filter(e=>!e.includes('favicon')&&!e.includes('ERR_BLOCKED_BY_CLIENT')&&!e.includes('Failed to load resource'));
            const badMeaningful=badResponses.filter(e=>!e.includes('favicon')&&!e.includes('kitchenlabksa.com/our_work/'));
            if(meaningful.length||badMeaningful.length)throw new Error(name+': runtime/network errors '+JSON.stringify({meaningful,badMeaningful}));
            await p.screenshot({path:'/home/runner/work/v7x/v7x/qa-kitchen-lab-live/live-'+name+'-viewport.png',fullPage:false});
            await p.screenshot({path:'/home/runner/work/v7x/v7x/qa-kitchen-lab-live/live-'+name+'-full.png',fullPage:true});
            out.push({viewport:name,http:res.status(),...init,before,after,ab,advisor,room,shareUrl,req,errors,badResponses});
            await p.close();
          }
          await browser.close();
          fs.writeFileSync('/home/runner/work/v7x/v7x/qa-kitchen-lab-live/results.json',JSON.stringify(out,null,2));
          console.log('KITCHEN_LAB_LIVE_QA_PASS');
          console.log(JSON.stringify(out.map(x=>({viewport:x.viewport,http:x.http,canvas:x.canvas,overflow:x.overflow,swatches:x.baseSwatches,tops:x.tops,score:x.req.score,errors:x.errors.length})),null,2));
          NODE
      - name: Run live Vercel QA
        run: node /tmp/kitchen-lab-qa/qa.mjs
      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kitchen-lab-v14-live-vercel-qa
          path: qa-kitchen-lab-live/
          retention-days: 7
