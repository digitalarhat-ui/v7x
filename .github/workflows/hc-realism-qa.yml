name: Higher Class V3 Reconstruction QA

on:
  workflow_dispatch:
    inputs:
      label:
        description: "Artifact label"
        required: false
        default: "v3-after"
  push:
    branches:
      - higher-class-photorealism-rescue-v3

permissions:
  contents: write

jobs:
  reconstruct-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authored-asset pipeline
        run: |
          python -m pip install --upgrade pip
          pip install cadquery==2.8.0 trimesh==4.11.1 scipy pillow
      - name: Build Higher Class authored GLB + PBR assets
        run: python tools/build_hc_v3_asset.py
      - name: Assert primitive hero core is removed
        run: |
          ! grep -q 'RoundedBoxGeometry' index.html
          ! grep -q 'new THREE.BoxGeometry' index.html
          grep -q 'GLTFLoader' index.html
          grep -q 'higher-class-fixed-kitchen-v3.glb' index.html
          test -s assets/higher-class-fixed-kitchen-v3.glb
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve app
        run: |
          python3 -m http.server 4173 > /tmp/hc-v3-server.log 2>&1 &
          sleep 2
      - name: Run V3 visual QA
        run: node qa/visual-qa.mjs ${{ github.event.inputs.label || 'v3-after' }}
      - name: Run V3 regression QA
        run: node qa/regression-qa.mjs
      - name: Package final source
        if: always()
        run: |
          zip -r qa-artifacts/HIGHER-CLASS-PHOTOREALISM-RESCUE-V3-FINAL.zip index.html assets vercel.json qa tools .github/workflows/hc-realism-qa.yml
      - name: Upload V3 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hc-v3-${{ github.run_id }}
          path: qa-artifacts/
          retention-days: 7
      - name: Commit generated authored assets
        if: success() && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if ! git diff --cached --quiet; then
            git commit -m "Build Higher Class V3 authored GLB assets"
            git push
          fi