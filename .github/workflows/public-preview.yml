name: Public Vercel Preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/public-preview.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current build
        uses: actions/checkout@v4

      - name: Package current demo
        run: tar -czf /tmp/project.tgz --exclude='.git' --exclude='.github' .

      - name: Deploy public Vercel preview
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsS -X POST "https://codex-deploy-skills.vercel.sh/api/deploy" -F "file=@/tmp/project.tgz" -F "framework=null")"
          echo "$RESPONSE"
          PREVIEW="$(printf '%s' "$RESPONSE" | jq -r '.previewUrl // empty')"
          CLAIM="$(printf '%s' "$RESPONSE" | jq -r '.claimUrl // empty')"
          if [ -z "$PREVIEW" ]; then
            echo "Preview URL missing" >&2
            exit 1
          fi
          echo "PUBLIC_PREVIEW_URL=$PREVIEW"
          echo "CLAIM_URL=$CLAIM"
