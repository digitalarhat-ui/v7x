name: Public Vercel Preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/public-preview.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current build
        uses: actions/checkout@v4

      - name: Check Vercel credential
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN_NOT_AVAILABLE"
            exit 2
          fi
          echo "VERCEL_TOKEN_AVAILABLE"

      - name: Deploy unrestricted Vercel preview
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npm install -g vercel@latest
          URL="$(vercel deploy --yes --token="$VERCEL_TOKEN")"
          echo "PUBLIC_PREVIEW_URL=$URL"
