name: Dakhakhni Phase 5 QA
on:
  push:
    branches: [dakhakhni-phase5-flow]
    paths:
      - 'kitchen-engine-v5/**'
      - 'dakhakhni-kitchen-v5/**'
      - '.github/workflows/dakhakhni-phase5-qa.yml'
permissions:
  contents: read
concurrency:
  group: dakhakhni-phase5-qa
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Syntax check
        run: node --check kitchen-engine-v5/core.js
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start server
        run: |
          python3 -m http.server 4178 --bind 127.0.0.1 >/tmp/p5.log 2>&1 &
          for i in $(seq 1 50); do
            curl -fsS http://127.0.0.1:4178/dakhakhni-kitchen-v5/ >/dev/null && exit 0
            sleep .2
          done
          cat /tmp/p5.log
          exit 1
      - name: Run Phase 5 journey and regression QA
        run: |
          cat > phase5-qa.mjs <<'EOF'
          import {chromium} from 'playwright';
          import fs from 'fs';
          import crypto from 'crypto';
          const base='http://127.0.0.1:4178/dakhakhni-kitchen-v5/';
          const out='qa-phase5';fs.mkdirSync(out,{recursive:true});
          const result={status:'PASS',viewports:{},friction:{},errors:[],screenshots:[]};
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function launch(width,height){
            const mobile=width<700,browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const context=await browser.newContext({viewport:{width,height},deviceScaleFactor:1,reducedMotion:'reduce',hasTouch:mobile,isMobile:mobile});
            const page=await context.newPage();page.setDefaultTimeout(20000);const errors=[];
            page.on('pageerror',e=>errors.push('page:'+e.message));page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
            await page.addInitScript(()=>localStorage.clear());await page.goto(base,{waitUntil:'domcontentloaded'});await page.waitForSelector('#heroCanvas');await sleep(650);
            return{browser,context,page,mobile,errors}
          }
          async function state(page){return page.evaluate(()=>JSON.parse(localStorage.getItem('dakhakhni:v5:project')||'null'))}
          async function shot(page,name){await page.screenshot({path:out+'/'+name+'.png',animations:'disabled'});result.screenshots.push(name+'.png')}
          async function tap(page,sel){await page.locator(sel).click({force:true});await sleep(120)}
          async function p1(page){
            await tap(page,'#heroStart');await tap(page,'[data-projecttype="new"]');await tap(page,'[data-layout="l"]');await tap(page,'[data-measuremode="known"]');
            await page.locator('#roomLength').fill('421');await page.locator('#roomLength').dispatchEvent('input');await sleep(80);await page.locator('#roomLength').fill('420');await page.locator('#roomLength').dispatchEvent('input');
            await page.locator('#roomWidth').fill('321');await page.locator('#roomWidth').dispatchEvent('input');await sleep(80);await page.locator('#roomWidth').fill('320');await page.locator('#roomWidth').dispatchEvent('input');
            await sleep(150);if(await page.locator('#roomLength').getAttribute('inputmode')!=='numeric')throw new Error('numeric keyboard hint missing');
            await tap(page,'#nextBtn');await page.waitForSelector('.stage[data-stage="2"].active')
          }
          async function orbit(page,sel){
            const box=await page.locator(sel).boundingBox();if(!box)throw new Error('no '+sel);const before=hash(await page.locator(sel).screenshot({animations:'disabled'})),x=box.x+box.width*.47,y=box.y+box.height*.48;
            await page.evaluate(({sel,x,y})=>{const c=document.querySelector(sel);c.dispatchEvent(new PointerEvent('pointerdown',{pointerId:91,pointerType:'touch',clientX:x,clientY:y,bubbles:true}));c.dispatchEvent(new PointerEvent('pointermove',{pointerId:91,pointerType:'touch',clientX:x+90,clientY:y+5,bubbles:true}));c.dispatchEvent(new PointerEvent('pointerup',{pointerId:91,pointerType:'touch',clientX:x+90,clientY:y+5,bubbles:true}))},{sel,x,y});await sleep(250);
            return before!==hash(await page.locator(sel).screenshot({animations:'disabled'}))
          }
          async function mobileVertical(page){
            await page.evaluate(()=>scrollTo(0,0));const before=await page.evaluate(()=>scrollY),box=await page.locator('#heroCanvas').boundingBox();if(!box)return false;
            const x=box.x+box.width*.5,y=box.y+box.height*.55;
            await page.evaluate(({x,y})=>{const c=document.querySelector('#heroCanvas');c.dispatchEvent(new PointerEvent('pointerdown',{pointerId:92,pointerType:'touch',clientX:x,clientY:y,bubbles:true}));c.dispatchEvent(new PointerEvent('pointermove',{pointerId:92,pointerType:'touch',clientX:x+4,clientY:y-120,bubbles:true}));c.dispatchEvent(new PointerEvent('pointerup',{pointerId:92,pointerType:'touch',clientX:x+4,clientY:y-120,bubbles:true}))},{x,y});
            await page.evaluate(()=>scrollBy(0,220));await sleep(120);return (await page.evaluate(()=>scrollY))>before
          }
          async function openGroup(page,k){const d=page.locator('.requirementGroup[data-reqgroup="'+k+'"]');if(!(await d.getAttribute('open')))await d.locator('summary').click();await sleep(100);await d.scrollIntoViewIfNeeded()}
          async function fullFlow(width,height){
            const tag=String(width),x=await launch(width,height),{page,browser,mobile,errors}=x;
            const heroOrbit=await orbit(page,'#heroCanvas');if(!heroOrbit)throw new Error(tag+' hero orbit');
            const vertical=mobile?await mobileVertical(page):true;if(!vertical)throw new Error(tag+' mobile vertical scroll');
            await p1(page);if(width<700){await page.locator('.stage[data-stage="1"]').scrollIntoViewIfNeeded();await shot(page,tag+'-01-phase1')}
            else {await page.locator('.stage[data-stage="1"]').scrollIntoViewIfNeeded();await shot(page,'1440-01-phase1')}
            await page.locator('[data-configtab="cabinet"]').click();await page.locator('[data-cabinet="oak"]').click();
            await page.locator('[data-configtab="worktop"]').click();await page.locator('[data-worktop="veined"]').click();
            await page.locator('[data-configtab="modules"]').click();await page.locator('[data-configslot="base:4"]').click();await page.locator('[data-configreplace="drawers"]').click();
            await page.locator('[data-configslot="tall:0"]').click();await page.locator('[data-configreplace="pantry"]').click();
            await page.locator('[data-configtab="details"]').click();if(!(await page.locator('#inspectUnit').isVisible()))throw new Error(tag+' pantry inspection missing');await page.locator('#inspectUnit').click();let st=await state(page);if(!st.config.inspect)throw new Error(tag+' inspection state');
            await page.locator('[data-configtab="modules"]').click();await page.locator('[data-configslot="tall:0"]').click();await page.locator('[data-configreplace="oven"]').click();
            await page.locator('[data-configtab="upper"]').click();await page.locator('[data-upper="glass"]').click();await page.locator('[data-upper="mixed"]').click();
            await page.locator('[data-configtab="details"]').click();await page.locator('[data-handle="linear"]').click();await page.locator('[data-handle="integrated"]').click();
            await page.locator('[data-configtab="modules"]').click();
            page.once('dialog',d=>d.accept());await page.locator('#resetConfig').click();await sleep(100);await page.locator('#undoConfig').click();st=await state(page);
            if(st.config.baseSlots[4]!=='drawers'||st.config.tallSlots[0]!=='oven')throw new Error(tag+' Phase4 reset/undo regression');
            if(width<700){await page.locator('#studioWrap').scrollIntoViewIfNeeded();await shot(page,tag+'-02-phase2')}else{await page.locator('.configuratorGrid').scrollIntoViewIfNeeded();await shot(page,'1440-02-phase2')}
            if(!(await orbit(page,'#studioCanvas')))throw new Error(tag+' studio orbit');
            for(const cam of ['functional','elevation','wide']){await page.locator('[data-camera="'+cam+'"]').click();await sleep(100)}
            await page.locator('#nextBtn').click({force:true});await page.waitForSelector('.stage[data-stage="3"].active');st=await state(page);
            if(!st.visual.saved)throw new Error(tag+' Phase2 one-action save failed');
            if(!(st.details.appliances.oven&&st.details.appliances.dishwasher&&st.details.appliances.hob))throw new Error(tag+' configurator appliances not inherited');
            if(!st.details.storage.deepDrawers)throw new Error(tag+' drawers not inherited');
            await openGroup(page,'usage');await page.locator('[data-userchoice="3-4"]').click();await page.locator('[data-cookingchoice="daily"]').click();
            await openGroup(page,'storage');await page.locator('[data-storage="pantry"]').click();if(width<700)await shot(page,tag+'-03-phase3-storage');
            await openGroup(page,'appliances');if(width<700)await shot(page,tag+'-04-phase3-appliances');
            if(await page.locator('#refFile').getAttribute('required'))throw new Error(tag+' optional reference became required');
            if(width===1440){await page.locator('.stage[data-stage="3"]').scrollIntoViewIfNeeded();await shot(page,'1440-03-phase3')}
            st=await state(page);const intentBefore={storage:JSON.stringify(st.details.storage),appliances:JSON.stringify(st.details.appliances)};
            await page.locator('#nextBtn').click({force:true});await page.waitForSelector('.stage[data-stage="4"].active');
            if(await page.locator('#detailsReviewed').count())throw new Error(tag+' ceremonial Phase3 button remains');
            if(await page.locator('#reviewConfirmed').count())throw new Error(tag+' ceremonial Phase4 button remains');
            const reviewText=await page.locator('.stage[data-stage="4"]').innerText();if(/\b\d{1,3}%\b/.test(reviewText)||reviewText.includes('جاهزية الملخص'))throw new Error(tag+' fake readiness remains');
            if((await page.locator('#reviewGroups .journeyGroup').count())!==6)throw new Error(tag+' review groups');
            if(width<700){await page.locator('.stage[data-stage="4"]').scrollIntoViewIfNeeded();await shot(page,tag+'-05-phase4-review')}else{await page.locator('.stage[data-stage="4"]').scrollIntoViewIfNeeded();await shot(page,'1440-04-phase4')}
            await page.locator('#reviewGroups [data-editphase="3"]').first().click();await page.waitForSelector('.stage[data-stage="3"].active');
            await page.locator('#nextBtn').click({force:true});await page.waitForSelector('.stage[data-stage="4"].active');await page.locator('#nextBtn').click({force:true});await page.waitForSelector('.stage[data-stage="5"].active');
            await page.locator('#customerName').fill('عميل تجريبي');await page.locator('#city').fill('الرياض');await page.locator('#projectNote').fill('أولوية للتخزين وسطح تحضير واضح.');await sleep(150);
            if(mobile){await page.locator('#customerName').focus();await sleep(80);const bnav=await page.locator('.bottomNav').evaluate(e=>({opacity:getComputedStyle(e).opacity,pointer:getComputedStyle(e).pointerEvents}));if(bnav.pointer!=='none')throw new Error(tag+' sticky nav overlaps focused field');await page.locator('#projectNote').focus();await page.locator('#projectNote').fill('أولوية للتخزين وسطح تحضير واضح.');await page.locator('#projectNote').blur()}
            const preview=(await page.locator('#waPreview').innerText()).trim(),lines=preview.split('\n').filter(Boolean);if(lines.length>15)throw new Error(tag+' WhatsApp too long '+lines.length);if(/slot_|cabinet=|baseSlots|config/i.test(preview))throw new Error(tag+' technical WhatsApp copy');
            const wa=await page.locator('#waButton').getAttribute('href');if(!wa?.startsWith('https://wa.me/966545246478?text='))throw new Error(tag+' WhatsApp route');
            if(width<700){await page.locator('.whatsappPanel').scrollIntoViewIfNeeded();await shot(page,tag+'-06-phase5-whatsapp')}else{await page.locator('.stage[data-stage="5"]').scrollIntoViewIfNeeded();await shot(page,'1440-05-phase5')}
            const savedBefore=await state(page);await page.reload({waitUntil:'domcontentloaded'});await page.waitForSelector('.stage[data-stage="5"].active');const savedAfter=await state(page);
            if(savedAfter.contact.name!=='عميل تجريبي'||savedAfter.project.city!=='الرياض'||savedAfter.visual.cabinet!=='oak'||savedAfter.visual.worktop!=='veined'||savedAfter.config.tallSlots[0]!=='oven'||!savedAfter.details.storage.pantry)throw new Error(tag+' reload persistence');

            await page.locator('#summaryGroups [data-editphase="1"]').first().click();await page.waitForSelector('.stage[data-stage="1"].active');
            await page.locator('#roomLength').fill('430');await page.locator('#roomLength').dispatchEvent('input');await sleep(120);st=await state(page);
            if(st.visual.cabinet!=='oak'||st.visual.worktop!=='veined')throw new Error(tag+' upstream edit lost materials');
            if(JSON.stringify(st.details.storage)!==intentBefore.storage||JSON.stringify(st.details.appliances)!==intentBefore.appliances)throw new Error(tag+' upstream edit lost requirements intent');
            await page.locator('#nextBtn').click({force:true});await page.waitForSelector('.stage[data-stage="2"].active');
            if((await state(page)).config.seeded!==true)throw new Error(tag+' config did not refresh after dimensions');
            await page.locator('#nextBtn').click({force:true});await page.waitForSelector('.stage[data-stage="3"].active');st=await state(page);
            if(JSON.stringify(st.details.storage)!==intentBefore.storage||JSON.stringify(st.details.appliances)!==intentBefore.appliances)throw new Error(tag+' Phase3 intent overwritten after upstream edit');

            const metrics=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,iw:innerWidth,phaseCount:document.querySelectorAll('.phaseProgress li').length,minTouch:Math.min(...[...document.querySelectorAll('button,.waButton,.shareButton')].filter(e=>e.offsetParent!==null).map(e=>e.getBoundingClientRect().height)),contamination:/FN\s*Cadena|Makan\s*Cars/i.test(document.body.innerText)}));
            if(metrics.sw>metrics.iw+1)throw new Error(tag+' overflow');if(metrics.phaseCount!==5)throw new Error(tag+' phase count');if(mobile&&metrics.minTouch<44)throw new Error(tag+' touch '+metrics.minTouch);if(metrics.contamination)throw new Error(tag+' contamination');if(errors.length)throw new Error(tag+' runtime '+errors.join(' | '));
            const js=await (await fetch('http://127.0.0.1:4178/kitchen-engine-v5/core.js')).text();if(!js.includes('PMREMGenerator')||!js.includes('hasPlausibleIsland')||!js.includes('configPanel'))throw new Error(tag+' locked engine markers missing');
            result.viewports[tag]={heroOrbit,vertical,whatsappLines:lines.length,minTouch:metrics.minTouch,scrollWidth:metrics.sw,phaseCount:metrics.phaseCount,errors};
            await browser.close()
          }
          async function friction(width,height){
            const x=await launch(width,height),p=x.page;let taps=0;const T=async sel=>{await p.locator(sel).click({force:true});taps++;await sleep(80)};
            const M=async n=>p.evaluate(n=>{const s=document.querySelector('.stage[data-stage="'+n+'"]');return{height:s?.scrollHeight||0,screens:+((s?.scrollHeight||0)/innerHeight).toFixed(2),copy:(s?.innerText||'').replace(/\s+/g,' ').trim().length,inputs:s?[...s.querySelectorAll('input,select,textarea')].filter(e=>e.offsetParent!==null).length:0}},n);
            await T('#heroStart');const p1m=await M(1);await T('[data-projecttype="new"]');await T('[data-layout="l"]');await T('[data-measuremode="known"]');await p.locator('#roomLength').fill('420');await p.locator('#roomWidth').fill('320');await T('#nextBtn');const p2m=await M(2);
            await T('#nextBtn');await p.waitForSelector('.stage[data-stage="3"].active');const p3m=await M(3);
            await T('#nextBtn');await p.waitForSelector('.stage[data-stage="4"].active');const p4m=await M(4);
            await T('#nextBtn');await p.waitForSelector('.stage[data-stage="5"].active');const p5m=await M(5);
            result.friction[String(width)]={mandatoryTaps:taps,requiredTextFields:2,phase3SelectInputs:await p.locator('.stage[data-stage="3"] select').count(),duplicateReselectionRequired:0,ceremonialButtons:(await p.locator('#detailsReviewed,#reviewConfirmed').count()),instructionalCopyChars:p1m.copy+p2m.copy+p3m.copy+p4m.copy+p5m.copy,pre3DScreens:p1m.screens,phase3Screens:p3m.screens,phase5Screens:p5m.screens};
            await x.browser.close()
          }
          try{
            for(const [w,h] of [[390,844],[430,900],[1440,1000]])await friction(w,h);
            for(const [w,h] of [[390,844],[430,900],[1440,1000]])await fullFlow(w,h);
          }catch(e){result.status='FAIL';result.errors.push(e.stack||String(e))}
          fs.writeFileSync(out+'/results.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result,null,2));if(result.status!=='PASS')process.exit(1)
          EOF
          node phase5-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dakhakhni-phase5-qa
          path: qa-phase5
          if-no-files-found: error
          retention-days: 3
