name: Lamar Kitchens V2.0 Live QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lamar-kitchens-live-qa.yml'
      - 'lamar-kitchens-v20/**'
      - 'vercel.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare live browser QA
        run: |
          mkdir -p /tmp/lamar-qa qa-lamar-live
          cd /tmp/lamar-qa
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24.19.0 --silent
          cat > qa.mjs <<'NODE'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';

          const live='https://lamar-kitchen-studio.vercel.app/';
          for(let i=0;i<30;i++){
            try{
              const r=await fetch(live,{redirect:'follow'});
              const t=await r.text();
              if(r.ok && t.includes('قوة لمار للمطابخ') && t.includes('966541717080') && !t.includes('العيدروس')) break;
            }catch{}
            if(i===29) throw new Error('Lamar clean alias did not become ready in time');
            await new Promise(r=>setTimeout(r,5000));
          }

          const browser=await puppeteer.launch({
            executablePath:'/usr/bin/google-chrome',
            headless:true,
            args:['--no-sandbox','--disable-dev-shm-usage','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--enable-webgl']
          });
          const sizes=[['390',390,844],['430',430,932],['1440',1440,900]];
          const out=[];

          for(const [name,w,h] of sizes){
            const p=await browser.newPage();
            await p.setViewport({width:w,height:h,deviceScaleFactor:1});
            const errors=[],badResponses=[];
            p.on('pageerror',e=>errors.push('page:'+String(e)));
            p.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
            p.on('response',r=>{if(r.status()>=400)badResponses.push(r.status()+' '+r.url())});

            const start=Date.now();
            const res=await p.goto(live,{waitUntil:'networkidle2',timeout:60000});
            await new Promise(r=>setTimeout(r,3500));
            const elapsed=Date.now()-start;

            const init=await p.evaluate(()=>({
              title:document.title,
              htmlDir:document.documentElement.dir,
              brand:document.querySelector('.brand')?.textContent?.trim()||'',
              canvas:[document.querySelector('#scene')?.width||0,document.querySelector('#scene')?.height||0],
              fallbackHidden:document.querySelector('#webglFallback')?.hidden===true,
              overflow:document.documentElement.scrollWidth-innerWidth,
              cabinetChoices:document.querySelectorAll('#cabinetSwatches .swatch').length,
              worktopChoices:document.querySelectorAll('#worktopSwatches .swatch').length,
              lightingChoices:document.querySelectorAll('.look[data-light]').length,
              whatsapp:document.querySelector('#whatsappLink')?.getAttribute('href')||'',
              forbidden:['العيدروس','العیدروس','966553590616','Digital Arhat','BEASTMODE','V1.4','Kitchen Lab','سمارت'].filter(x=>document.documentElement.innerHTML.includes(x)),
              authentic:{
                imageOk:(()=>{const i=document.querySelector('#authenticCard img');return !!(i&&i.complete&&i.naturalWidth>100)})(),
                cardHidden:document.querySelector('#authenticCard')?.hidden===true,
                fallbackHidden:document.querySelector('#authenticFallback')?.hidden===true
              },
              nav:performance.getEntriesByType('navigation')[0] ? {
                dom:Math.round(performance.getEntriesByType('navigation')[0].domContentLoadedEventEnd),
                load:Math.round(performance.getEntriesByType('navigation')[0].loadEventEnd)
              } : null
            }));

            if(!res||res.status()>=400) throw new Error(name+': HTTP '+(res?.status()||'none'));
            if(!init.title.includes('لمار')||!init.brand.includes('لمار')) throw new Error(name+': identity failed '+JSON.stringify({title:init.title,brand:init.brand}));
            if(init.htmlDir!=='rtl') throw new Error(name+': RTL failed');
            if(init.canvas[0]<100||init.canvas[1]<100||!init.fallbackHidden) throw new Error(name+': WebGL scene failed '+JSON.stringify(init));
            if(init.overflow>2) throw new Error(name+': horizontal overflow '+init.overflow);
            if(init.cabinetChoices<8||init.worktopChoices<5||init.lightingChoices!==2) throw new Error(name+': decision controls incomplete '+JSON.stringify(init));
            if(init.forbidden.length) throw new Error(name+': cross-prospect contamination '+JSON.stringify(init.forbidden));
            if(!init.authentic.imageOk && init.authentic.fallbackHidden) throw new Error(name+': authentic asset failed without visible failsafe '+JSON.stringify(init.authentic));

            const before=await p.evaluate(()=>({
              cabinet:document.querySelector('#stateCabinet')?.textContent||'',
              worktop:document.querySelector('#stateWorktop')?.textContent||'',
              light:document.querySelector('#stateLight')?.textContent||''
            }));
            await p.click('#cabinetSwatches .swatch[data-value="sage"]');
            await p.click('#worktopSwatches .swatch[data-value="warmstone"]');
            await p.click('.look[data-light="warm"]');
            await new Promise(r=>setTimeout(r,250));
            const visual=await p.evaluate(()=>({
              cabinet:document.querySelector('#stateCabinet')?.textContent||'',
              worktop:document.querySelector('#stateWorktop')?.textContent||'',
              light:document.querySelector('#stateLight')?.textContent||''
            }));
            if(visual.cabinet===before.cabinet||!visual.cabinet.includes('أخضر')||!visual.worktop.includes('حجر')||!visual.light.includes('دافئة')) throw new Error(name+': visual decisions did not update '+JSON.stringify({before,visual}));

            await p.select('#branch','طريق المدينة المنورة الفرعي — الرياض');
            await p.select('#stageSelect','مطبخ جديد');
            await p.select('#shape','مع جزيرة');
            await p.type('#size','4 × 3 م');
            await p.type('#note','أحتاج مساحة تخزين أكبر');
            await new Promise(r=>setTimeout(r,300));

            const state=await p.evaluate(()=>({
              url:location.href,
              summary:document.querySelector('#summary')?.textContent||'',
              wa:document.querySelector('#whatsappLink')?.getAttribute('href')||'',
              activeCabinet:document.querySelector('#cabinetSwatches .swatch.active')?.dataset.value||'',
              activeWorktop:document.querySelector('#worktopSwatches .swatch.active')?.dataset.value||''
            }));

            for(const token of ['أخضر هادئ','حجر دافئ','طريق المدينة المنورة الفرعي — الرياض','مطبخ جديد','مع جزيرة','4 × 3 م','أحتاج مساحة تخزين أكبر']){
              if(!state.summary.includes(token)) throw new Error(name+': summary lost '+token);
            }
            for(const param of ['c=sage','w=warmstone','l=warm','b=','s=','sh=','z=','n=']){
              if(!state.url.includes(param)) throw new Error(name+': state URL missing '+param+' '+state.url);
            }
            if(!state.wa.startsWith('https://wa.me/966541717080?text=')) throw new Error(name+': WhatsApp route failed '+state.wa);
            const decoded=decodeURIComponent(state.wa);
            for(const token of ['أخضر هادئ','حجر دافئ','طريق المدينة المنورة الفرعي — الرياض','4 × 3 م','أحتاج مساحة تخزين أكبر']){
              if(!decoded.includes(token)) throw new Error(name+': WhatsApp handoff lost '+token);
            }

            // Reload exact-state URL and ensure visual/project state is restored.
            await p.reload({waitUntil:'networkidle2',timeout:60000});
            await new Promise(r=>setTimeout(r,1200));
            const restored=await p.evaluate(()=>({
              cabinet:document.querySelector('#stateCabinet')?.textContent||'',
              worktop:document.querySelector('#stateWorktop')?.textContent||'',
              light:document.querySelector('#stateLight')?.textContent||'',
              branch:document.querySelector('#branch')?.value||'',
              stage:document.querySelector('#stageSelect')?.value||'',
              shape:document.querySelector('#shape')?.value||'',
              size:document.querySelector('#size')?.value||'',
              note:document.querySelector('#note')?.value||'',
              overflow:document.documentElement.scrollWidth-innerWidth,
              fallbackHidden:document.querySelector('#webglFallback')?.hidden===true
            }));
            if(restored.cabinet!=='أخضر هادئ'||restored.worktop!=='حجر دافئ'||restored.light!=='دافئة'||restored.branch!=='طريق المدينة المنورة الفرعي — الرياض'||restored.stage!=='مطبخ جديد'||restored.shape!=='مع جزيرة'||restored.size!=='4 × 3 م'||restored.note!=='أحتاج مساحة تخزين أكبر') throw new Error(name+': exact state restore failed '+JSON.stringify(restored));
            if(restored.overflow>2||!restored.fallbackHidden) throw new Error(name+': post-reload layout/WebGL failed '+JSON.stringify(restored));

            const meaningful=errors.filter(e=>!e.includes('favicon')&&!e.includes('ERR_BLOCKED_BY_CLIENT')&&!e.includes('Failed to load resource'));
            const badMeaningful=badResponses.filter(e=>!e.includes('favicon'));
            if(meaningful.length||badMeaningful.length) throw new Error(name+': runtime/network errors '+JSON.stringify({meaningful,badMeaningful}));

            await p.screenshot({path:'/home/runner/work/v7x/v7x/qa-lamar-live/live-'+name+'-viewport.png',fullPage:false});
            await p.screenshot({path:'/home/runner/work/v7x/v7x/qa-lamar-live/live-'+name+'-full.png',fullPage:true});
            out.push({viewport:name,http:res.status(),elapsed,init,visual,state,restored,errors,badResponses});
            await p.close();
          }

          await browser.close();
          fs.writeFileSync('/home/runner/work/v7x/v7x/qa-lamar-live/results.json',JSON.stringify(out,null,2));
          console.log('LAMAR_LIVE_QA_PASS');
          console.log(JSON.stringify(out.map(x=>({
            viewport:x.viewport,http:x.http,canvas:x.init.canvas,overflow:x.init.overflow,
            elapsed:x.elapsed,dom:x.init.nav?.dom,load:x.init.nav?.load,errors:x.errors.length,badResponses:x.badResponses.length
          })),null,2));
          NODE
      - name: Run live Vercel QA
        run: node /tmp/lamar-qa/qa.mjs
      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lamar-kitchens-v20-live-vercel-qa
          path: qa-lamar-live/
          retention-days: 7
