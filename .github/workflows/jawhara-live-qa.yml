name: Jawhara Live Vercel QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jawhara-live-qa.yml'
      - 'jawhara.html'
      - 'vercel.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare live browser QA
        run: |
          mkdir -p /tmp/jawhara-live qa-live
          cd /tmp/jawhara-live
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24.19.0 --silent
          cat > qa.mjs <<'NODE'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';

          const live='https://jawhara-almalim-studio.vercel.app/';
          const browser=await puppeteer.launch({
            executablePath:'/usr/bin/google-chrome',
            headless:true,
            args:['--no-sandbox','--disable-dev-shm-usage','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--enable-webgl']
          });
          const sizes=[['390',390,844],['430',430,932],['768',768,1024],['1440',1440,900]];
          const out=[];

          for (const [name,w,h] of sizes){
            const p=await browser.newPage();
            await p.setViewport({width:w,height:h,deviceScaleFactor:1});
            const errors=[];
            p.on('pageerror',e=>errors.push('page:'+String(e)));
            p.on('console',m=>{if(m.type()==='error') errors.push('console:'+m.text())});

            const res=await p.goto(live,{waitUntil:'networkidle2',timeout:60000});
            await new Promise(r=>setTimeout(r,1800));

            const init=await p.evaluate(()=>({
              url:location.href,
              title:document.title,
              three:!!window.THREE,
              canvas:[document.querySelector('#scene')?.width||0,document.querySelector('#scene')?.height||0],
              overflow:document.documentElement.scrollWidth-innerWidth,
              wordmark:document.querySelector('.wordmark')?.textContent?.trim()||'',
              wa:document.querySelector('#directWa')?.href||'',
              internal:['Digital Arhat','Lovable','V1.4'].some(x=>document.body.innerText.includes(x))
            }));

            if(!res || res.status()>=400) throw new Error(name+': HTTP '+(res?.status()||'none'));
            if(!init.url.endsWith('/jawhara')) throw new Error(name+': root redirect failed '+init.url);
            if(!init.title.includes('جوهرة المعالم') || init.wordmark!=='جوهرة المعالم') throw new Error(name+': identity failed');
            if(!init.three || init.canvas[0]<100 || init.canvas[1]<100) throw new Error(name+': WebGL failed '+JSON.stringify(init.canvas));
            if(init.overflow>2) throw new Error(name+': horizontal overflow '+init.overflow);
            if(init.internal) throw new Error(name+': internal branding leaked');
            if(!init.wa.includes('wa.me/966550437444')) throw new Error(name+': WhatsApp route mismatch');

            await p.screenshot({path:'/home/runner/work/v7x/v7x/qa-live/live-'+name+'-viewport.png',fullPage:false});
            if(name==='390'||name==='1440') await p.screenshot({path:'/home/runner/work/v7x/v7x/qa-live/live-'+name+'-full.png',fullPage:true});

            await p.click('.look[data-look="sage"]');
            await new Promise(r=>setTimeout(r,200));
            let state=await p.evaluate(()=>location.search);
            if(!state.includes('front=sage')||!state.includes('top=quartz')||!state.includes('light=day')) throw new Error(name+': curated look failed '+state);

            await p.evaluate(()=>document.querySelector('#saveA').click());
            await p.click('.look[data-look="walnut"]');
            await new Promise(r=>setTimeout(r,200));
            await p.evaluate(()=>document.querySelector('#saveB').click());
            const ab=await p.evaluate(()=>({
              a:document.querySelector('#nameA')?.textContent||'',
              b:document.querySelector('#nameB')?.textContent||'',
              d:document.querySelector('#compareHeadline')?.textContent||''
            }));
            if(!ab.a.includes('ساج')||!ab.b.includes('خشب')||!ab.d.includes('الفرق')) throw new Error(name+': A/B failed '+JSON.stringify(ab));

            await p.evaluate(()=>document.querySelector('.open-sheet').click());
            await new Promise(r=>setTimeout(r,450));
            for(let i=0;i<5;i++){
              await p.waitForSelector('#wizardOptions .wizard-option',{visible:true,timeout:5000});
              await p.evaluate(()=>document.querySelector('#wizardOptions .wizard-option').click());
              await new Promise(r=>setTimeout(r,70));
              await p.evaluate(()=>document.querySelector('#nextStep').click());
              await new Promise(r=>setTimeout(r,200));
            }
            const summary=await p.evaluate(()=>({
              show:document.querySelector('#summaryView')?.classList.contains('show'),
              rows:document.querySelectorAll('#summaryList .summary-row').length,
              wa:document.querySelector('#directWa')?.href||''
            }));
            if(!summary.show||summary.rows!==6||!summary.wa.includes('text=')) throw new Error(name+': readiness/handoff failed '+JSON.stringify(summary));

            const meaningfulErrors=errors.filter(e=>!e.includes('favicon'));
            if(meaningfulErrors.length) throw new Error(name+': console errors '+JSON.stringify(meaningfulErrors));

            out.push({name,http:res.status(),...init,ab,summary,errors});
            await p.close();
          }
          await browser.close();
          fs.writeFileSync('/home/runner/work/v7x/v7x/qa-live/results.json',JSON.stringify(out,null,2));
          console.log('LIVE_QA_PASS');
          console.log(JSON.stringify(out.map(x=>({viewport:x.name,http:x.http,url:x.url,webgl:x.three,canvas:x.canvas,overflow:x.overflow,summaryRows:x.summary.rows,errors:x.errors.length})),null,2));
          NODE
      - name: Run live Vercel QA
        run: node /tmp/jawhara-live/qa.mjs
      - name: Upload live QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jawhara-live-vercel-qa
          path: qa-live/
          retention-days: 7
