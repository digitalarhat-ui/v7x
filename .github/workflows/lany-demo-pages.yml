name: Deploy Lany Hall Jeddah concept to GitHub Pages
on:
  push:
    branches:
      - demo/lany-hall-jeddah-20261010
    paths:
      - 'lany-hall-jeddah/**'
      - '.github/workflows/lany-demo-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: lany-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact lead branch
        uses: actions/checkout@v4
      - name: Prepare isolated, noindex concept files
        run: |
          mkdir -p .pages/lany-hall-jeddah
          cp -R lany-hall-jeddah/. .pages/lany-hall-jeddah/
          touch .pages/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static files
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
