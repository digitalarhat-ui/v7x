name: Lamsat Al Bayan V5 Live QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lamsat-al-bayan-v5-live-qa.yml'
      - 'lamsat-al-bayan-kitchen-v5/**'

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Validate live Wix production
        run: |
          cat > lamsat-live.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          fs.mkdirSync('lamsat-live-qa',{recursive:true});
          const url='https://headless-ckkxrasdkwe-digitalarhat-140c.wix-site-host.com/';
          const result={status:'PASS',url,viewports:{},errors:[]};

          async function run(name,width,height){
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({
              viewport:{width,height},
              deviceScaleFactor:1,
              hasTouch:width<=430,
              isMobile:width<=430,
              reducedMotion:'reduce'
            });
            const page=await context.newPage();
            page.setDefaultTimeout(30000);
            const runtimeErrors=[];
            page.on('pageerror',e=>runtimeErrors.push('page:'+e.message));
            page.on('console',m=>{ if(m.type()==='error') runtimeErrors.push('console:'+m.text()); });

            await page.goto(url,{waitUntil:'networkidle',timeout:90000});
            await page.waitForSelector('#lamsatAlBayanV5 .hero',{timeout:45000});
            await page.waitForSelector('#heroCanvas',{timeout:45000});
            await page.waitForTimeout(2500);

            const initial=await page.evaluate(()=>({
              title:document.title,
              dir:document.documentElement.dir,
              scrollWidth:document.documentElement.scrollWidth,
              innerWidth,
              mount:!!document.querySelector('#lamsatAlBayanV5'),
              three:!!window.THREE,
              heroText:document.querySelector('.hero')?.innerText||'',
              heroCanvas:document.querySelector('#heroCanvas')?.getBoundingClientRect().toJSON(),
              stages:document.querySelectorAll('[data-stage]').length,
              layouts:[...document.querySelectorAll('[data-layout]')].map(x=>x.getAttribute('data-layout')),
              gallery:document.querySelectorAll('.lamsatRealWork img').length,
              foreign:(document.body.innerText||'').includes('دخاخني')
            }));

            if(initial.title!=='لمسة البيان | استوديو مشروع المطبخ') throw new Error(name+' title mismatch: '+initial.title);
            if(initial.dir!=='rtl') throw new Error(name+' RTL missing');
            if(!initial.mount||!initial.three) throw new Error(name+' app/THREE missing');
            if(!initial.heroText.includes('مطبخك يبدأ من رؤيتك')) throw new Error(name+' hero value copy missing');
            if(!initial.heroCanvas||initial.heroCanvas.width<250||initial.heroCanvas.height<220) throw new Error(name+' hero 3D canvas too small');
            if(initial.scrollWidth>width+1) throw new Error(name+' initial horizontal overflow '+initial.scrollWidth+'>'+width);
            if(initial.stages!==5) throw new Error(name+' expected 5 stages, got '+initial.stages);
            for(const k of ['l','u','parallel','island']) if(!initial.layouts.includes(k)) throw new Error(name+' layout missing: '+k);
            if(initial.gallery!==3) throw new Error(name+' authentic gallery count '+initial.gallery);
            if(initial.foreign) throw new Error(name+' foreign identity visible');

            await page.screenshot({path:'lamsat-live-qa/'+name+'-hero.png',fullPage:false});

            // Actual customer path: new kitchen -> L layout -> known measurements -> 3D -> review -> handoff.
            await page.click('#heroStart');
            await page.click('[data-projecttype="new"]');
            await page.click('[data-layout="l"]');
            await page.click('[data-measuremode="known"]');
            await page.fill('#roomLength','420');
            await page.fill('#roomWidth','320');
            await page.click('#nextBtn');
            await page.waitForFunction(()=>document.querySelector('[data-stage="2"]')?.classList.contains('active'));
            await page.waitForTimeout(1800);

            const phase2=await page.evaluate(()=>({
              canvas:document.querySelector('#studioCanvas')?.getBoundingClientRect().toJSON(),
              state:document.querySelector('#studioState')?.textContent||'',
              phase:document.querySelector('#phaseNumber')?.textContent||'',
              overflow:document.documentElement.scrollWidth>innerWidth+1
            }));
            if(!phase2.canvas||phase2.canvas.width<250||phase2.canvas.height<220) throw new Error(name+' studio canvas too small');
            if(phase2.phase.trim()!=='2') throw new Error(name+' phase2 not active');
            if(phase2.overflow) throw new Error(name+' phase2 horizontal overflow');

            // Prove material controls respond and stay functional.
            const oak=page.locator('[data-cabinet="oak"]').first();
            if(await oak.count()) await oak.click();
            const warm=page.locator('[data-worktop="warm"]').first();
            if(await warm.count()) await warm.click();
            await page.waitForTimeout(600);
            await page.screenshot({path:'lamsat-live-qa/'+name+'-phase2.png',fullPage:false});

            await page.click('#nextBtn');
            await page.waitForFunction(()=>document.querySelector('[data-stage="3"]')?.classList.contains('active'));
            await page.click('#nextBtn');
            await page.waitForFunction(()=>document.querySelector('[data-stage="4"]')?.classList.contains('active'));
            await page.click('#nextBtn');
            await page.waitForFunction(()=>document.querySelector('[data-stage="5"]')?.classList.contains('active'));
            await page.waitForTimeout(500);

            const final=await page.evaluate(()=>({
              phase:document.querySelector('#phaseNumber')?.textContent||'',
              waHref:document.querySelector('#waButton')?.getAttribute('href')||'',
              waText:document.querySelector('#waPreview')?.textContent||'',
              bodyText:document.body.innerText||'',
              scrollWidth:document.documentElement.scrollWidth,
              innerWidth
            }));
            if(final.phase.trim()!=='5') throw new Error(name+' did not reach phase 5');
            if(!final.waHref.includes('966541537978')) throw new Error(name+' wrong/missing Lamsat WhatsApp handoff: '+final.waHref);
            if(!final.waText.includes('لمسة البيان')) throw new Error(name+' WhatsApp preview missing Lamsat identity');
            if(!final.waText.includes('حرف L')) throw new Error(name+' final brief lost L layout');
            if(final.bodyText.includes('دخاخني')) throw new Error(name+' foreign identity in final stage');
            if(final.scrollWidth>width+1) throw new Error(name+' final horizontal overflow');

            await page.screenshot({path:'lamsat-live-qa/'+name+'-phase5.png',fullPage:false});

            // Images should actually load.
            const imageState=await page.evaluate(()=>[...document.querySelectorAll('.lamsatRealWork img')].map(i=>({complete:i.complete,naturalWidth:i.naturalWidth})));
            if(imageState.some(i=>!i.complete||i.naturalWidth<100)) throw new Error(name+' authentic image failed to load');

            // Ignore only expected favicon/network noise; app/runtime errors are blockers.
            const materialErrors=runtimeErrors.filter(e=>!e.includes('favicon'));
            if(materialErrors.length) throw new Error(name+' runtime errors: '+materialErrors.join(' | '));

            result.viewports[name]={initial,phase2,final,imageState};
            await browser.close();
          }

          try{
            await run('desktop-1440',1440,900);
            await run('mobile-430',430,932);
            await run('mobile-390',390,844);
          }catch(e){
            result.status='FAIL';
            result.errors.push(e.stack||String(e));
          }
          fs.writeFileSync('lamsat-live-qa/results.json',JSON.stringify(result,null,2));
          if(result.status!=='PASS') process.exitCode=1;
          EOF
          node lamsat-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lamsat-al-bayan-v5-live-qa
          path: lamsat-live-qa
          if-no-files-found: error
          retention-days: 3
