name: Dakhakhni Alternate Live Final QA
on:
  push:
    branches: [dakhakhni-alt-live-qa-20261006]
    paths:
      - '.github/workflows/dakhakhni-alt-live-final-qa.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Run live alternate-host QA
        run: |
          cat > live-final.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          fs.mkdirSync('alt-live-qa',{recursive:true});
          const url='https://dakhakhni-kitchen-demo.lovable.app/';
          const result={status:'PASS',url,viewports:{},errors:[]};
          async function setVal(page,sel,v){const l=page.locator(sel);await l.fill(String(v));await l.dispatchEvent('input');}
          async function run(name,width,height){
            const browser=await chromium.launch({headless:true});
            try {
            const context=await browser.newContext({
              viewport:{width,height},
              deviceScaleFactor:1,
              reducedMotion:'reduce',
              permissions:['clipboard-read','clipboard-write']
            });
            const page=await context.newPage();
            page.setDefaultTimeout(20000);
            const errors=[];
            page.on('pageerror',e=>errors.push('page:'+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
            const badResponses=[];
            page.on('response',r=>{if(r.status()>=400)badResponses.push(r.status()+' '+r.url())});
            await page.goto(url,{waitUntil:'networkidle',timeout:60000});
            await page.waitForSelector('#heroCanvas',{timeout:30000});
            await page.waitForTimeout(1200);
            const first=await page.evaluate(()=>({
              title:document.title,
              dir:document.documentElement.dir,
              sw:document.documentElement.scrollWidth,
              iw:innerWidth,
              heroText:document.querySelector('.hero')?.innerText||'',
              canvas:document.querySelector('#heroCanvas')?.getBoundingClientRect().toJSON(),
              mount:!!document.querySelector('#dakhakhniV5'),
              three:!!window.THREE,
              badge:[...document.querySelectorAll('body *')].some(el=>((el.textContent||'').trim()==='Edit with Lovable') && getComputedStyle(el).display!=='none'),
              copyBriefPresent:!!document.querySelector('#copyBrief'),
              coreSrc:[...document.scripts].map(x=>x.src).find(x=>x.includes('/kitchen-engine-v5/core.js'))||''
            }));
            await page.screenshot({path:'alt-live-qa/'+name+'-hero.png',fullPage:false});
            if(first.title!=='دخاخني | ابدأ مشروع مطبخك')throw new Error(name+' title mismatch');
            if(first.dir!=='rtl'||!first.mount||!first.three)throw new Error(name+' shell/runtime mismatch');
            if(first.sw>width+1)throw new Error(name+' hero horizontal overflow');
            if(!first.heroText.includes('رتّب مشروع مطبخك'))throw new Error(name+' hero copy missing');
            if(!first.canvas||first.canvas.width<250||first.canvas.height<250)throw new Error(name+' hero canvas too small');
            if(first.badge)throw new Error(name+' Lovable badge visible');
            if(!first.coreSrc.includes('c4457536fd1d974ea30d6e97179a890f9fb39145'))throw new Error(name+' core not pinned to final SHA');

            // Phase 1
            await page.locator('#heroStart').click();
            await page.locator('[data-projecttype="new"]').click();
            await page.locator('[data-layout="l"]').click();
            await page.locator('[data-measuremode="known"]').click();
            await setVal(page,'#roomLength',420);
            await setVal(page,'#roomWidth',320);
            await page.locator('#nextBtn').click();
            await page.waitForSelector('.stage[data-stage="2"].active');

            // Phase 2: material continuity + configurator present
            await page.locator('[data-cabinet="oak"]').first().click();
            await page.locator('[data-worktop="veined"]').first().click();
            await page.waitForTimeout(300);
            const p2=await page.evaluate(()=>({
              config:!!document.querySelector('#configPanel'),
              studio:document.querySelector('#studioCanvas')?.getBoundingClientRect().toJSON(),
              selectedCab:[...document.querySelectorAll('[data-cabinet="oak"]')].some(x=>x.classList.contains('active')),
              selectedTop:[...document.querySelectorAll('[data-worktop="veined"]')].some(x=>x.classList.contains('active'))
            }));
            if(!p2.config||!p2.studio||p2.studio.width<250)throw new Error(name+' Phase2 configurator/studio missing');
            await page.screenshot({path:'alt-live-qa/'+name+'-phase2.png',fullPage:false});
            await page.locator('#nextBtn').click();
            await page.waitForSelector('.stage[data-stage="3"].active');

            // Phase 3 -> Phase 4 -> Phase 5
            await page.locator('#nextBtn').click();
            await page.waitForSelector('.stage[data-stage="4"].active');
            await page.locator('#nextBtn').click();
            await page.waitForSelector('.stage[data-stage="5"].active');
            await setVal(page,'#customerName','عميل تجريبي');
            await setVal(page,'#city','ينبع');
            await setVal(page,'#projectNote','أولوية للتخزين ومساحة التحضير.');
            await page.waitForTimeout(250);
            await page.screenshot({path:'alt-live-qa/'+name+'-phase5.png',fullPage:false});

            const final=await page.evaluate(()=>({
              sw:document.documentElement.scrollWidth,
              iw:innerWidth,
              wa:document.querySelector('#waButton')?.getAttribute('href')||'',
              waText:document.querySelector('#waPreview')?.innerText||'',
              waLines:(document.querySelector('#waPreview')?.innerText||'').split(/\n/).filter(Boolean).length,
              copyBrief:!!document.querySelector('#copyBrief'),
              share:!!document.querySelector('#shareProject'),
              briefNeeds:(document.querySelector('#briefNeedsText')?.innerText||''),
              code:(document.querySelector('.projectCode')?.innerText||''),
              internalLeak:/slot_|PMREM|Three\.js|prototype engine|GLB/i.test(document.body.innerText),
              contamination:/FN Cadena|Makan Cars|Higher Class|Roaa/i.test(document.body.innerText),
              minTouch:Math.min(...[...document.querySelectorAll('button,a.waButton')].filter(x=>x.offsetParent!==null).map(x=>Math.min(x.getBoundingClientRect().height,x.getBoundingClientRect().width)))
            }));
            if(final.sw>width+1)throw new Error(name+' final horizontal overflow');
            if(!final.wa.startsWith('https://wa.me/966545246478?text='))throw new Error(name+' WhatsApp route mismatch');
            if(!final.copyBrief||!final.share)throw new Error(name+' canonical handoff actions missing');
            if(!final.briefNeeds)throw new Error(name+' needs-confirmation brief missing');
            if(final.internalLeak)throw new Error(name+' internal technical language leaked');
            if(final.contamination)throw new Error(name+' prospect contamination');
            if(final.minTouch<44)throw new Error(name+' touch target below 44px: '+final.minTouch);
            if(errors.length)throw new Error(name+' runtime errors: '+errors.join(' | '));
            if(badResponses.length)throw new Error(name+' failed resources: '+badResponses.join(' | '));

            result.viewports[name]={first,p2,final,errors,badResponses};
            } finally {
              await browser.close();
            }
          }
          for(const v of [
            {name:'mobile-390',width:390,height:844},
            {name:'mobile-430',width:430,height:900},
            {name:'desktop-1440',width:1440,height:1000}
          ]){
            try{ await run(v.name,v.width,v.height); }
            catch(e){ result.status='FAIL'; result.errors.push(v.name+': '+(e.stack||String(e))); }
          }
          fs.writeFileSync('alt-live-qa/results.json',JSON.stringify(result,null,2));
          console.log('QA_RESULT_START'); console.log(JSON.stringify(result,null,2)); console.log('QA_RESULT_END');
          if(result.status!=='PASS')process.exitCode=1;
          EOF
          node live-final.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dakhakhni-alternate-live-final-qa
          path: alt-live-qa
          if-no-files-found: error
          retention-days: 2
