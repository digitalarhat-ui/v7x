name: H Laylati immutable CDN public preview QA
on:
  push:
    branches: [hlaylati-madinah-white-rose-20261014]
    paths: ['.github/workflows/hlaylati-cdn-preview.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  static-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hlaylati-madinah-white-rose-20261014
          persist-credentials: true
      - name: Client-specific preview files — no Vercel or cost
        shell: bash
        run: |
          python patches/make-hlaylati-static-preview.py
          node --check hlaylati-public-preview/hlaylati-layer.js
          node --check hlaylati-public-preview/wr-bilingual.js
          node --check hlaylati-public-preview/hlaylati-guard.js
          git config user.name "Digital Arhat QA"
          git config user.email "actions@users.noreply.github.com"
          git add hlaylati-public-preview/
          git commit -m "Publish isolated public H Laylati review preview sources" || true
          git push origin HEAD:hlaylati-madinah-white-rose-20261014
          echo "COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PREVIEW_URL=https://cdn.githubraw.com/digitalarhat-ui/v7x/$(git rev-parse HEAD)/hlaylati-public-preview/index.html" >> "$GITHUB_ENV"
      - name: Check exact CDN route response
        shell: bash
        run: |
          echo "Candidate source: $PREVIEW_URL"
          sleep 3
          python - <<'PY'
          import urllib.request,os,time
          u=os.environ["PREVIEW_URL"]
          for i in range(6):
            try:
              with urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"}),timeout=25) as r:
                body=r.read(60000).decode("utf-8","replace")
                print("CDN_HTTP",r.status,"content_type",r.headers.get("content-type"),"test_snippet",body[:120])
                assert r.status==200 and ("هذه ليلتي" in body or "H Laylati" in body)
                break
            except Exception as e:
              print("CDN_CHECK_ATTEMPT",i+1,str(e)[:200])
              if i==5:raise
              time.sleep(5)
          PY
      - name: Chromium setup
        run: |
          pip install --quiet playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Actual immutable public CDN browser QA
        shell: bash
        run: |
          mkdir -p qa-output/hlaylati/cdn-shots
          cat >/tmp/hlaylati_cdn_qa.py <<'PY'
          import asyncio,json,os,datetime
          from playwright.async_api import async_playwright
          U=os.environ["PREVIEW_URL"];OUT="qa-output/hlaylati"
          result={"lead":"SA-3F-20261014-HLAYLATI-MADINAH","url":U,"commit":os.environ["COMMIT_SHA"],"tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
          "rights_independently_confirmed":False,"buyer_approved":False,"management_review_only":True,"verified_live_booking":False,"widths":{}}
          async def run():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True,args=["--no-sandbox"])
              for w in [390,430,768,1440]:
                ctx=await browser.new_context(viewport={"width":w,"height":900},is_mobile=w<768,has_touch=w<768)
                pg=await ctx.new_page();errs=[]
                pg.on("pageerror",lambda e: errs.append(str(e)[:300]))
                q={}
                try:
                  res=await pg.goto(U,wait_until="domcontentloaded",timeout=35000);await pg.wait_for_timeout(2100)
                  q["http"]=res.status;q["url"]=pg.url
                  q["unprotected"]=not ("login" in pg.url.lower() or "vercel authentication" in (await pg.title()).lower())
                  q["widget"]=await pg.locator("#hly-component").count()==1
                  q["brand"]=await pg.evaluate("()=>/هذه ليلتي|H Laylati/.test(document.body.innerText)")
                  q["foreign"]=await pg.evaluate("()=>/White Rose|Mavera|الوردة البيضاء|ماڤيرا|memoriesforevents/i.test(document.body.innerText)")
                  q["overflow"]=await pg.evaluate("()=>Math.max(0,document.documentElement.scrollWidth-innerWidth)")
                  q["photos"]=await pg.locator("#hly-component .hly-photo img").evaluate_all("(xs)=>xs.map(x=>({w:x.naturalWidth,h:x.naturalHeight,ok:x.complete}))")
                  q["photo_render"]=len(q["photos"])==2 and all(x["w"]>100 for x in q["photos"])
                  q["matterports"]=await pg.locator("#hly-tours a[href*='my.matterport.com']").count()
                  q["script_errors"]=errs[:]
                  if w==390:
                    await pg.locator("#hly-hall").select_option("badrah")
                    await pg.locator("#hly-men").fill("150")
                    await pg.locator("#hly-women").fill("180")
                    await pg.locator("#hly-date").fill("2026-12-05")
                    link=await pg.locator("#hly-review").get_attribute("href")
                    q["review_link"]=link
                    await pg.reload(wait_until="domcontentloaded");await pg.wait_for_timeout(1100)
                    q["persist"]=await pg.locator("#hly-men").input_value()=="150" and await pg.locator("#hly-women").input_value()=="180"
                    await pg.locator("#hly-lang").click()
                    q["en"]="Venue" in await pg.locator("#hly-title").inner_text()
                    rev=await ctx.new_page()
                    rv=await rev.goto(link,wait_until="domcontentloaded",timeout=25000)
                    await rev.wait_for_timeout(1250)
                    q["review_http"]=rv.status
                    q["review_propagates"]=all(t in await rev.locator("#hly-summary").inner_text() for t in ["Badrah","150","180","2026-12-05"])
                    q["review_guard"]=await rev.locator("#hlaylati-concept-notice").count()==1
                    q["review_overflow"]=await rev.evaluate("()=>Math.max(0,document.documentElement.scrollWidth-innerWidth)")
                    await rev.screenshot(path=f"{OUT}/cdn-shots/review-390.png",full_page=True,animations="disabled")
                  await pg.screenshot(path=f"{OUT}/cdn-shots/home-{w}.png",full_page=True,animations="disabled")
                  q["PASS"]=all([q["http"]==200,q["unprotected"],q["widget"],q["brand"],not q["foreign"],q["overflow"]<5,q["photo_render"],q["matterports"]==5,not q["script_errors"],w!=390 or (q.get("persist") and q.get("en") and q.get("review_http")==200 and q.get("review_propagates") and q.get("review_guard") and q.get("review_overflow",999)<5)])
                except Exception as e:
                  q["PASS"]=False;q["exception"]=str(e)[:400]
                result["widths"][str(w)]=q
                await ctx.close()
              await browser.close()
          asyncio.run(run())
          result["status"]="PUBLIC_CDN_CHROMIUM_QA_PASS_OWNER_REVIEW_ONLY" if len(result["widths"])==4 and all(v.get("PASS") for v in result["widths"].values()) else "PUBLIC_CDN_QA_FAIL"
          with open(OUT+"/cdn-qa.json","w") as f:json.dump(result,f,ensure_ascii=False,indent=2)
          print("PUBLIC_CDN_QA",json.dumps({"status":result["status"],"url":U,"checks":{k:{x:v.get(x) for x in ("http","widget","photos","photo_render","matterports","PASS","exception","review_http","review_propagates")} for k,v in result["widths"].items()}}))
          if result["status"]!="PUBLIC_CDN_CHROMIUM_QA_PASS_OWNER_REVIEW_ONLY":raise SystemExit(1)
          PY
          python /tmp/hlaylati_cdn_qa.py
      - name: Upload screenshots and report regardless of QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hlaylati-public-cdn-browser-evidence
          path: |
            qa-output/hlaylati/cdn-shots/
            qa-output/hlaylati/cdn-qa.json
          if-no-files-found: warn
      - name: Persist CDN public link and QA readout to same branch
        if: always()
        shell: bash
        run: |
          test -f qa-output/hlaylati/cdn-qa.json || exit 0
          git config user.name "Digital Arhat QA"
          git config user.email "actions@users.noreply.github.com"
          git add qa-output/hlaylati/cdn-qa.json
          git commit -m "H Laylati immutable public browser QA evidence" || true
          git push origin HEAD:hlaylati-madinah-white-rose-20261014 || true
