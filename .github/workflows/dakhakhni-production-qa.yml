name: Dakhakhni Production QA
on:
  push:
    branches: [dakhakhni-prod-qa]
    paths: ['.github/workflows/dakhakhni-production-qa.yml']
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Test production alias
        run: |
          cat > prodqa.mjs <<'EOF'
          import {chromium} from 'playwright'; import fs from 'fs';
          fs.mkdirSync('prod-qa',{recursive:true});
          const base='https://dakhakhni-kitchen-studio.vercel.app/';
          const result={status:'PASS',viewports:{},errors:[]};
          async function run(name,width,height){
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width,height},deviceScaleFactor:1,reducedMotion:'reduce'});
            const page=await context.newPage(); page.setDefaultTimeout(20000);
            const errs=[];page.on('pageerror',e=>errs.push('page:'+e.message));page.on('console',m=>{if(m.type()==='error')errs.push('console:'+m.text())});
            await page.goto(base,{waitUntil:'networkidle',timeout:60000});
            await page.waitForSelector('#heroCanvas',{timeout:30000});
            await page.waitForTimeout(1200);
            await page.screenshot({path:'prod-qa/'+name+'-hero.png',fullPage:false});

            const hero=await page.evaluate(()=>({
              title:document.title,dir:document.documentElement.dir,
              iw:innerWidth,sw:document.documentElement.scrollWidth,
              heroText:document.querySelector('.hero')?.innerText||'',
              canvas:document.querySelector('#heroCanvas')?.getBoundingClientRect().toJSON(),
              bottom:getComputedStyle(document.querySelector('.bottomNav')).visibility
            }));

            await page.locator('#heroStart').click();
            await page.locator('[data-projecttype="new"]').click();
            await page.locator('#city').fill('ينبع');
            await page.locator('[data-layout="l"]').click();
            await page.locator('[data-measuremode="known"]').click();
            await page.locator('#roomLength').fill('420');
            await page.locator('#roomWidth').fill('320');
            await page.locator('#roomHeight').fill('280');
            await page.locator('#nextBtn').click();
            await page.waitForSelector('.stage[data-stage="2"].active');
            await page.waitForTimeout(1000);
            await page.screenshot({path:'prod-qa/'+name+'-phase2.png',fullPage:false});
            await page.locator('[data-cabinet="oak"]').click();
            await page.locator('[data-worktop="quartz"]').click();
            await page.locator('#saveVisual').click();
            await page.locator('#nextBtn').click();
            await page.waitForSelector('.stage[data-stage="3"].active');
            await page.locator('[data-storage="pantry"]').click({force:true});
            await page.locator('[data-storage="deepDrawers"]').click({force:true});
            await page.locator('[data-appliance="fridge"]').click({force:true});
            await page.locator('[data-appliance="oven"]').click({force:true});
            await page.locator('[data-appliance="dishwasher"]').click({force:true});
            await page.selectOption('#users','3-4');
            await page.selectOption('#cooking','daily');
            await page.locator('#detailsReviewed').click({force:true});
            await page.locator('#nextBtn').click();
            await page.waitForSelector('.stage[data-stage="4"].active');
            await page.locator('#reviewConfirmed').click({force:true});
            await page.locator('#nextBtn').click();
            await page.waitForSelector('.stage[data-stage="5"].active');
            await page.locator('#customerName').fill('عميل تجريبي');
            await page.locator('#projectNote').fill('أولوية للتخزين ومساحة التحضير.');
            await page.waitForTimeout(200);
            await page.screenshot({path:'prod-qa/'+name+'-phase5.png',fullPage:false});

            const final=await page.evaluate(()=>({
              url:location.href, iw:innerWidth, sw:document.documentElement.scrollWidth,
              wa:document.querySelector('#waButton')?.getAttribute('href')||'',
              summary:document.querySelector('#waPreview')?.innerText||'',
              minMajorButton:Math.min(...[...document.querySelectorAll('.topCta,.btnPrimary,.btnSecondary,.choice,.toggle,.saveVisual,.backBtn,.nextBtn,.waButton,.shareButton,.cameraBar button,.swatch')].filter(x=>x.offsetParent!==null).map(x=>x.getBoundingClientRect().height)),
              stageStates:[...document.querySelectorAll('.phaseProgress li')].map(x=>({active:x.dataset.active,complete:x.dataset.complete}))
            }));
            result.viewports[name]={hero,final,errs};
            if(hero.title!=='دخاخني | ابدأ مشروع مطبخك')throw new Error(name+' title mismatch');
            if(hero.dir!=='rtl')throw new Error(name+' rtl missing');
            if(hero.sw>width+1||final.sw>width+1)throw new Error(name+' horizontal overflow');
            if(!hero.heroText.includes('رتّب مشروع مطبخك'))throw new Error(name+' hero value missing');
            if(!hero.canvas||hero.canvas.width<250||hero.canvas.height<250)throw new Error(name+' 3D canvas too small');
            if(!final.wa.startsWith('https://wa.me/966545246478?text='))throw new Error(name+' WhatsApp route mismatch');
            if(!final.summary.includes('420 × 320 × 280 سم'))throw new Error(name+' dimensions lost');
            if(!final.summary.includes('أدراج عميقة'))throw new Error(name+' storage lost');
            if(final.url.includes('?project='))throw new Error(name+' long share state appeared without user share');
            if(final.minMajorButton<44)throw new Error(name+' touch target below 44px: '+final.minMajorButton);
            if(errs.length)throw new Error(name+' runtime errors: '+errs.join(' | '));
            await browser.close();
          }
          try{
            for(const v of [{name:'desktop-1440',width:1440,height:1000},{name:'mobile-430',width:430,height:900},{name:'mobile-390',width:390,height:844}]) await run(v.name,v.width,v.height);
          }catch(e){result.status='FAIL';result.errors.push(e.stack||String(e))}
          fs.writeFileSync('prod-qa/results.json',JSON.stringify(result,null,2));
          if(result.status!=='PASS') process.exitCode=1;
          EOF
          node prodqa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dakhakhni-production-qa
          path: prod-qa
          if-no-files-found: error
          retention-days: 2
      - name: Store compact QA result
        if: always()
        run: |
          rm -rf prod-qa-output
          mkdir -p prod-qa-output
          cp prod-qa/results.json prod-qa-output/results.json || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prod-qa-output
          git commit -m "Store Dakhakhni production QA result" || true
          git push origin HEAD:dakhakhni-prod-qa
