name: Al-Hudhudi V8 Authentic Media + Source Conflict QA
on:
  push:
    branches: [alhudhudi-decision-room-v8-20261015]
    paths:
      - 'alhudhudi-rabigh-review/**'
      - '.github/workflows/alhudhudi-decision-room-v8-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  premium-public:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Source and integrity
        run: |
          set -e
          node --check alhudhudi-rabigh-review/premium-v4.js
          node --check alhudhudi-rabigh-review/venue-3d.js
          node --check alhudhudi-rabigh-review/decision-v7.js
          node --check alhudhudi-rabigh-review/media-v8.js
          python - <<'PY'
          from pathlib import Path
          p=Path('alhudhudi-rabigh-review')
          for f in ('index.html','review/index.html'):
            text=(p/f).read_text('utf8')
            assert text.count('premium-v4.js')==1
            assert text.count('venue-3d.js')==1
            assert 'experience-v2.js' not in text
            assert 'wr-bilingual.js' not in text
            assert 'alhudhudi-layer.js' not in text
          for f in ('index.html','review/index.html','premium-v4.css','premium-v4.js','venue-3d.js'):
            text=(p/f).read_text('utf8')
            for c in ('H Laylati','هذه ليلتي','Badrah','بدرة','my.matterport.com','White Rose','الوردة البيضاء'):
              assert c not in text,(f,c)
          print('PREMIUM_SOURCE_PASS')
          PY
      - name: Immutable public routes
        run: |
          echo "URL=https://cdn.githubraw.com/digitalarhat-ui/v7x/$GITHUB_SHA/alhudhudi-rabigh-review/index.html" >> "$GITHUB_ENV"
          python - <<'PY'
          import os,time,urllib.request
          base='https://cdn.githubraw.com/digitalarhat-ui/v7x/'+os.environ['GITHUB_SHA']+'/alhudhudi-rabigh-review/'
          for f in ('index.html','review/index.html','premium-v4.js','premium-v4.css','venue-3d.js','venue-3d.css','decision-v7.js','decision-v7.css','media-v8.js','media-v8.css'):
            for n in range(10):
              try:
                with urllib.request.urlopen(urllib.request.Request(base+f,headers={'User-Agent':'Mozilla/5.0'}),timeout=30) as r:
                  assert r.status==200
                  assert len(r.read())>300
                  print('HTTP200',f)
                  break
              except Exception as e:
                if n==9:raise
                time.sleep(6)
          PY
      - name: Headless browser graphics test
        run: |
          pip install -q playwright==1.55.0 pillow
          python -m playwright install --with-deps chromium
      - name: Real scene, screenshots and review journey
        run: |
          mkdir -p qa-output/alhudhudi-v8
          cat > /tmp/qa_v8.py <<'PY'
          import asyncio,os,json,base64,io
          from PIL import Image
          from playwright.async_api import async_playwright
          url=os.environ['URL'];report={'url':url,'sha':os.environ['GITHUB_SHA'],'status':'OWNER_REVIEW_ONLY','real_property_3d_scan':False,'results':{}}
          def screenshot_log(label,raw):
            im=Image.open(io.BytesIO(raw)).convert('RGB')
            w=650;h=round(im.height*w/im.width);im=im.resize((w,h))
            out=io.BytesIO();im.save(out,format='JPEG',quality=57,optimize=True)
            print('SCREEN_BASE64_'+label+'_BEGIN'+base64.b64encode(out.getvalue()).decode('ascii')+'SCREEN_BASE64_'+label+'_END')
          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True,args=['--no-sandbox','--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader'])
              for width in [390,430,768,1440]:
                ctx=await browser.new_context(viewport={'width':width,'height':900},is_mobile=width<768,has_touch=width<768)
                page=await ctx.new_page()
                errors=[];page.on('pageerror',lambda e:errors.append(str(e)))
                r=None
                for retry in range(8):
                  r=await page.goto(url,wait_until='domcontentloaded',timeout=50000)
                  print('PUBLIC_BROWSER_NAV',width,retry,r.status)
                  if r.status==200: break
                  await page.wait_for_timeout(4500)
                assert r.status==200,('NON200_PUBLIC_CDN',width,r.status)
                await page.wait_for_function('window.alhudhudi3D?.status()?.ready===true',timeout=50000)
                await page.wait_for_function('window.alhudhudi3D?.status()?.frames>=1',timeout=15000)
                assert await page.locator('#ah3d-experience').count()==1
                assert await page.locator('#ahx-v2 .lux-opening').count()==1
                if width==390:
                  assert await page.locator('#a3-hero-overlay').count()==1
                  assert await page.evaluate('document.querySelector("#ah3d-experience").compareDocumentPosition(document.querySelector(".lux-intro")) & Node.DOCUMENT_POSITION_FOLLOWING')
                  await page.locator('#a3-hero-overlay .lux-hero-btn').click()
                  assert await page.locator('#ah3d-experience.a3-focused').count()==1
                  await page.locator('#a3-show-intro').click()
                  assert await page.locator('#ah3d-experience.a3-focused').count()==0
                  await page.locator('#ah3d-experience [data-view="aisle"]').click()
                  assert (await page.evaluate('window.alhudhudi3D.getState()'))['camera']=='aisle'
                stat=await page.evaluate('window.alhudhudi3D.status()')
                assert stat['triangles']>50000,stat
                assert await page.evaluate('window.alhudhudi3D.snapshot().length')>20000,'EMPTY_3D_RENDER'
                assert await page.locator('#a3-webgl').count()==1
                assert not errors,errors
                overflow=await page.evaluate('Math.max(0,document.documentElement.scrollWidth-innerWidth)')
                assert overflow<10,(width,'overflow',overflow)
                await page.locator('#ah3d-experience').scroll_into_view_if_needed()
                await page.wait_for_timeout(250)
                viewshot=await page.screenshot(type='jpeg',quality=82)
                if width==390:
                  screenshot_log('MOBILE_3D',viewshot)
                  await page.screenshot(path='qa-output/alhudhudi-v8/mobile-3d.png',full_page=False)
                if width==1440:
                  screenshot_log('DESKTOP_3D',viewshot)
                  await page.screenshot(path='qa-output/alhudhudi-v8/desktop-3d.png',full_page=False)
                  await page.evaluate('window.scrollTo(0,0)')
                  await page.wait_for_timeout(150)
                  screenshot_log('DESKTOP_HERO',await page.screenshot(type='jpeg',quality=82))
                if width==390:
                  first=await page.evaluate('window.alhudhudi3D.snapshot()')
                  for k,v in [('palette','pearl'),('layout','banquet'),('aisle','wide'),('light','day'),('hall','moonlight')]:
                    await page.locator('#ah3d-experience [data-key="'+k+'"][data-val="'+v+'"]').click()
                  await page.locator('#ah3d-experience [data-view="stage"]').click()
                  await page.wait_for_timeout(350)
                  second=await page.evaluate('window.alhudhudi3D.snapshot()')
                  assert first!=second,'3D PIXELS UNCHANGED'
                  assert await page.locator('#hly-hall').input_value()=='moonlight'
                  assert await page.locator('#buyer-v7').count()==1,'MISSING_GUEST_FIT'
                  assert await page.locator('#buyer-v7 .buyer-metric').count()==3
                  assert '350' in await page.locator('#buyer-v7').inner_text()
                  assert '500' in await page.locator('#buyer-v7').inner_text()
                  assert '800+' in await page.locator('#buyer-v7').inner_text(),'CONTRADICTORY_FAQ_NOT_DISCLOSED'
                  assert await page.locator('#real-venue-v8').count()==1,'ORIGINAL_MEDIA_STUDIO_MISSING'
                  assert await page.evaluate('window.alhudhudiRealMedia?.state()?.uploaded===false'),'MEDIA_PRIVACY_FLAG'
                  from PIL import Image as PILImage
                  fixture=PILImage.new('RGB',(1200,600))
                  for xx in range(1200):
                    for yy in range(600):
                      fixture.putpixel((xx,yy),((xx*210)//1200,(yy*180)//600,110))
                  import io as _io
                  buf=_io.BytesIO()
                  fixture.save(buf,format='PNG')
                  await page.locator('[data-real="royal"]').click()
                  await page.locator('#real-file').set_input_files({'name':'authorized-fixture-panorama.png','mimeType':'image/png','buffer':buf.getvalue()})
                  await page.wait_for_function("window.alhudhudiRealMedia?.state()?.royal?.pano===true",timeout=20000)
                  await page.wait_for_function("window.alhudhudiRealMedia?.state()?.frames>=1",timeout=20000)
                  assert await page.locator('#real-webgl').count()==1,'REAL_PANORAMA_RENDERER_MISSING'
                  assert not await page.evaluate("window.alhudhudiRealMedia.state().uploaded"),'MEDIA_WAS_UPLOADED'
                  await page.locator('#real-venue-v8').scroll_into_view_if_needed()
                  await page.screenshot(path='qa-output/alhudhudi-v8/device-only-360-test.png',full_page=False)
                  await page.locator('#real-clear').click()
                  assert (await page.evaluate("window.alhudhudiRealMedia.state().royal")) is None,'MEDIA_CLEAR_FAILED'
                  await page.locator('#hly-men').fill('351')
                  await page.wait_for_timeout(160)
                  assert await page.locator('#buyer-men').get_attribute('data-status')=='conflicting','MEN_CAPACITY_WARNING_MISSING'
                  await page.locator('#hly-women').fill('501')
                  await page.wait_for_timeout(160)
                  assert await page.locator('#buyer-women').get_attribute('data-status')=='conflicting','WOMEN_CAPACITY_WARNING_MISSING'
                  await page.locator('#hly-men').fill('150')
                  await page.locator('#hly-women').fill('180')
                  await page.locator('#hly-date').fill('2026-12-12')
                  await page.locator('input[data-feature="catering"]').check()
                  await page.locator('#ahx-notes').fill('Need to confirm guest table spacing')
                  assert 'اتجاه التصميم' in await page.locator('#ahx-summary').inner_text(),'AR_VISUAL_CONCEPT_BRIEF'
                  await page.locator('#ahx-lang').click()
                  assert 'The setting, distinctly yours' in await page.locator('.lux-intro').inner_text()
                  assert 'Illustrative 3D design direction' in await page.locator('#ahx-summary').inner_text()
                  await page.wait_for_timeout(180)
                  assert 'Questions requiring confirmation' in await page.locator('#ahx-summary').inner_text(),'MANAGER_QUESTIONS_NOT_IN_SUMMARY'
                  assert 'Conflicting numbers / Unverified' in await page.locator('#buyer-v7').inner_text(),'SCOPE_DISCLAIMER_MISSING'
                  await page.locator('#buyer-v7').scroll_into_view_if_needed()
                  await page.screenshot(path='qa-output/alhudhudi-v8/buyer-fit-mobile.png',full_page=False)
                  assert await page.locator('#buyer-men').get_attribute('data-status')=='unverified','MEN_BELOW_PUBLISHED_ESTIMATE'
                  assert await page.locator('#buyer-women').get_attribute('data-status')=='unverified','WOMEN_BELOW_PUBLISHED_ESTIMATE'
                  link=await page.locator('#ahx-review').get_attribute('href')
                  assert 'requirements=' in link and 'visual=' in link and 'brief=' in link,link
                  assert 'buyer_questions=yes' in link,'BUYER_VERIFICATION_STATE_MISSING'
                  reviewer=await ctx.new_page()
                  rr=None
                  for retry in range(8):
                    rr=await reviewer.goto(link,wait_until='domcontentloaded',timeout=50000)
                    print('PUBLIC_BROWSER_REVIEW_NAV',retry,rr.status)
                    if rr.status==200:break
                    await reviewer.wait_for_timeout(4500)
                  assert rr.status==200,('REVIEW_PUBLIC_NON200',rr.status)
                  await reviewer.wait_for_function('window.alhudhudi3D?.status()?.ready===true',timeout=50000)
                  rv=await reviewer.evaluate('window.alhudhudi3D.getState()')
                  assert rv['palette']=='pearl' and rv['layout']=='banquet' and rv['hall']=='moonlight'
                  assert await reviewer.locator('#hly-men').input_value()=='150'
                  assert await reviewer.locator('#hly-women').input_value()=='180'
                  assert await reviewer.locator('#hly-date').input_value()=='2026-12-12'
                  assert await reviewer.locator('input[data-feature="catering"]').is_checked()
                  assert await reviewer.locator('#ahx-notes').input_value()=='Need to confirm guest table spacing'
                  assert 'Illustrative 3D design direction' in await reviewer.locator('#ahx-summary').inner_text()
                  await reviewer.wait_for_timeout(180)
                  assert await reviewer.locator('#buyer-v7').count()==1,'REVIEW_BUYER_FIT_MISSING'
                  assert 'Questions requiring confirmation' in await reviewer.locator('#ahx-summary').inner_text(),'REVIEW_QUESTIONS_LOST'
                  assert '800+' in await reviewer.locator('#buyer-v7').inner_text(),'CAPACITY_CONTRADICTION_LOST'
                  assert (await reviewer.evaluate('window.alhudhudiBuyerFit?.state()?.men?.value'))==150,'REVIEW_CAPACITY_STATE_LOST'
                  await reviewer.screenshot(path='qa-output/alhudhudi-v8/review-mobile.png',full_page=True)
                  print('FULL_CUSTOMER_TO_MANAGER_REVIEW_PASS')
                  await reviewer.close()
                report['results'][str(width)]={'http':r.status,'real_webgl':True,'triangles':stat['triangles'],'js_errors':len(errors),'overflow':overflow}
                print('PREMIUM_DEVICE_PASS',width,report['results'][str(width)])
                await ctx.close()
              await browser.close()
          asyncio.run(main())
          with open('qa-output/alhudhudi-v8/report.json','w') as f:json.dump(report,f,indent=2)
          print('V8_REAL_MEDIA_SOURCE_CONFLICT_QA_PASS',json.dumps(report))
          PY
          python /tmp/qa_v8.py
      - name: Save proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alhudhudi-decision-room-v8-qa
          path: qa-output/alhudhudi-v8/
          retention-days: 7