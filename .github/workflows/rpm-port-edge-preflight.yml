name: RPM PORT zero-cost static preview edge preflight
on:
  push:
    branches: [rpm-port-makan-v4-review-20261014]
    paths: ['.github/workflows/rpm-port-edge-preflight.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test static edge MIME and response without enabling paid hosting
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://raw.githack.com/digitalarhat-ui/v7x/rpm-port-makan-v4-review-20261014/rpm-port-riyadh-makan-v4-review/index.html"
            "https://cdn.jsdelivr.net/gh/digitalarhat-ui/v7x@rpm-port-makan-v4-review-20261014/rpm-port-riyadh-makan-v4-review/index.html"
            "https://raw.githubusercontent.com/digitalarhat-ui/v7x/rpm-port-makan-v4-review-20261014/rpm-port-riyadh-makan-v4-review/index.html"
          )
          for url in "${urls[@]}"; do
            echo "STATIC_EDGE_TEST=$url"
            curl -sSL -o /tmp/edge.html -w "RESULT status=%{http_code} type=%{content_type} bytes=%{size_download} target=%{url_effective}\n" --max-time 15 -A "Mozilla/5.0" "$url" || true
            head -c 100 /tmp/edge.html;echo
          done
