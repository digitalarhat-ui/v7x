name: Jawhara Visual QA
on:
  push:
    branches: [main]
    paths:
      - 'jawhara.html'
      - 'vendor/three-r128.min.js'
      - '.github/workflows/jawhara-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare browser QA
        run: |
          mkdir -p /tmp/jawhara-qa qa-output
          cd /tmp/jawhara-qa
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24.19.0 --silent
          cat > qa.mjs <<'NODE'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';

          const chrome = process.env.CHROME_PATH;
          const browser = await puppeteer.launch({
            executablePath: chrome,
            headless: true,
            args: ['--no-sandbox','--disable-dev-shm-usage','--use-gl=swiftshader','--enable-webgl']
          });

          const cases = [
            {w:390,h:844,name:'390'},
            {w:430,h:932,name:'430'},
            {w:768,h:1024,name:'768'},
            {w:1440,h:900,name:'1440'}
          ];
          const results=[];

          for (const c of cases) {
            const page=await browser.newPage();
            await page.setViewport({width:c.w,height:c.h,deviceScaleFactor:1});
            const consoleErrors=[];
            page.on('pageerror',e=>consoleErrors.push(String(e)));
            page.on('console',m=>{ if(m.type()==='error') consoleErrors.push(m.text()); });
            await page.goto('http://127.0.0.1:4173/jawhara.html',{waitUntil:'networkidle2',timeout:60000});
            await new Promise(r=>setTimeout(r,1800));

            const initial=await page.evaluate(()=>({
              title:document.title,
              hasThree:!!window.THREE,
              canvas:{w:document.querySelector('#scene')?.width||0,h:document.querySelector('#scene')?.height||0},
              overflow:document.documentElement.scrollWidth-window.innerWidth,
              hero:document.querySelector('h1')?.textContent?.trim()||'',
              bodyText:document.body.innerText,
              wa:document.querySelector('#directWa')?.href||''
            }));

            if(!initial.title.includes('جوهرة المعالم')) throw new Error(c.name+': wrong title');
            if(!initial.hasThree) throw new Error(c.name+': Three.js failed to load');
            if(initial.canvas.w<100 || initial.canvas.h<100) throw new Error(c.name+': WebGL canvas not sized');
            if(initial.overflow>2) throw new Error(c.name+': horizontal overflow '+initial.overflow);
            if(initial.bodyText.includes('Digital Arhat') || initial.bodyText.includes('Lovable') || initial.bodyText.includes('V1.4')) throw new Error(c.name+': internal branding leaked');
            if(!initial.wa.includes('wa.me/966550437444')) throw new Error(c.name+': WhatsApp route mismatch');

            await page.screenshot({path:'/home/runner/work/v7x/v7x/qa-output/jawhara-'+c.name+'-viewport.png',fullPage:false});
            if(c.name==='390' || c.name==='1440') {
              await page.screenshot({path:'/home/runner/work/v7x/v7x/qa-output/jawhara-'+c.name+'-full.png',fullPage:true});
            }

            // Real interaction pass once per size: curated look -> save A -> alternate -> save B.
            await page.click('.look[data-look="sage"]');
            await new Promise(r=>setTimeout(r,250));
            const sage=await page.evaluate(()=>location.search);
            if(!sage.includes('front=sage') || !sage.includes('top=quartz') || !sage.includes('light=day')) throw new Error(c.name+': curated look state failed');

            await page.click('#saveA');
            await page.click('.look[data-look="walnut"]');
            await new Promise(r=>setTimeout(r,250));
            await page.click('#saveB');
            const ab=await page.evaluate(()=>({
              a:document.querySelector('#nameA')?.textContent||'',
              b:document.querySelector('#nameB')?.textContent||'',
              headline:document.querySelector('#compareHeadline')?.textContent||''
            }));
            if(!ab.a.includes('ساج') || !ab.b.includes('خشب')) throw new Error(c.name+': A/B save failed');
            if(!ab.headline.includes('الفرق')) throw new Error(c.name+': A/B diff summary failed');

            // Open readiness wizard and complete all 5 steps.
            await page.click('.open-sheet');
            for(let i=0;i<5;i++){
              await page.waitForSelector('#wizardOptions .wizard-option',{visible:true});
              await page.click('#wizardOptions .wizard-option');
              await page.click('#nextStep');
              await new Promise(r=>setTimeout(r,120));
            }
            const summary=await page.evaluate(()=>({
              visible:document.querySelector('#summaryView')?.classList.contains('show'),
              rows:document.querySelectorAll('#summaryList .summary-row').length,
              href:document.querySelector('#directWa')?.href||''
            }));
            if(!summary.visible || summary.rows<6) throw new Error(c.name+': readiness summary failed');
            if(!summary.href.includes('wa.me/966550437444') || !summary.href.includes('text=')) throw new Error(c.name+': structured WhatsApp handoff failed');

            results.push({viewport:c,...initial,ab,summary,consoleErrors});
            await page.close();
          }

          await browser.close();
          fs.writeFileSync('/home/runner/work/v7x/v7x/qa-output/results.json',JSON.stringify(results,null,2));
          console.log(JSON.stringify(results.map(r=>({viewport:r.viewport.name,hasThree:r.hasThree,canvas:r.canvas,overflow:r.overflow,consoleErrors:r.consoleErrors.length,summaryRows:r.summary.rows})),null,2));
          NODE
      - name: Run browser QA
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          python3 -m http.server 4173 >/tmp/jawhara-http.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          sleep 2
          node /tmp/jawhara-qa/qa.mjs
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jawhara-visual-qa
          path: qa-output/
          retention-days: 7
