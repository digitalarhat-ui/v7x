name: RPM PORT public asset HTTP audit
on:
  push:
    branches: [rpm-port-makan-v4-review-20261014]
    paths: ['.github/workflows/rpm-port-public-assets.yml']
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Public served asset MIME and availability
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githack.com/digitalarhat-ui/v7x/rpm-port-makan-v4-review-20261014/rpm-port-riyadh-makan-v4-review/'
          files=(preview/index.html preview/en.html assets/showroom.css assets/showroom-preview.js assets/showroom-en-preview.js assets/rpm-defender.webp assets/rpm-range.webp)
          for path in "${files[@]}";do
            curl --max-time 15 -sS -L -o /tmp/rpmtest -w "CHECK $path HTTP %{http_code} TYPE %{content_type} BYTES %{size_download}\n" "$base$path" || true
          done
