name: Publish Jawhara Studio
on:
  push:
    branches: [main]
    paths:
      - 'jawhara/**'
      - 'vendor/**'
      - '.github/workflows/jawhara-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare artifact
        run: |
          rm -rf .pages
          mkdir -p .pages/vendor
          cp -R jawhara/. .pages/
          cp vendor/three-r128.min.js .pages/vendor/three-r128.min.js
          touch .pages/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
