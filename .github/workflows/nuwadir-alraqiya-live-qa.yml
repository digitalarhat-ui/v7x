name: Nuwadir Alraqiya V2.0 Live QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nuwadir-alraqiya-live-qa.yml'
      - 'nuwadir-alraqiya-v20/**'
      - 'vercel.json'
      - 'favicon.ico'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare live browser QA
        run: |
          mkdir -p /tmp/nuwadir-qa qa-nuwadir-live
          cd /tmp/nuwadir-qa
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24.19.0 --silent
          cat > qa.mjs <<'NODE'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';

          const live='https://nuwadir-alraqiya.vercel.app/';
          for(let i=0;i<36;i++){
            try{
              const r=await fetch(live,{redirect:'follow'});
              const t=await r.text();
              if(r.ok && t.includes('نوادر المطابخ الراقية') && t.includes('966550503109') && t.includes('966539455822') && t.includes('/vendor/three-r128.min.js') && !t.includes('لمار')) break;
            }catch{}
            if(i===35) throw new Error('Nuwadir clean alias did not become ready in time');
            await new Promise(r=>setTimeout(r,5000));
          }

          const browser=await puppeteer.launch({
            executablePath:'/usr/bin/google-chrome',
            headless:true,
            args:['--no-sandbox','--disable-dev-shm-usage','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--enable-webgl']
          });
          const sizes=[['390',390,844],['430',430,932],['1440',1440,900]];
          const out=[];

          for(const [name,w,h] of sizes){
            const p=await browser.newPage();
            await p.evaluateOnNewDocument(()=>{try{localStorage.clear()}catch{}});
            await p.setViewport({width:w,height:h,deviceScaleFactor:1});

            const errors=[],badResponses=[];
            p.on('pageerror',e=>errors.push('page:'+String(e)));
            p.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
            p.on('response',r=>{if(r.status()>=400)badResponses.push(r.status()+' '+r.url())});

            const start=Date.now();
            const res=await p.goto(live,{waitUntil:'networkidle2',timeout:60000});
            await new Promise(r=>setTimeout(r,2500));
            const elapsed=Date.now()-start;

            const init=await p.evaluate(()=>({
              title:document.title,
              htmlDir:document.documentElement.dir,
              host:location.host,
              path:location.pathname,
              brand:document.querySelector('.brand')?.textContent?.trim()||'',
              canvas:[document.querySelector('#scene')?.width||0,document.querySelector('#scene')?.height||0],
              canvasRect:(()=>{const r=document.querySelector('#scene')?.getBoundingClientRect();return r?{w:Math.round(r.width),h:Math.round(r.height)}:null})(),
              fallbackHidden:document.querySelector('#webglFallback')?.hidden===true,
              overflow:document.documentElement.scrollWidth-innerWidth,
              cabinetChoices:document.querySelectorAll('#cabinetSwatches .swatch').length,
              worktopChoices:document.querySelectorAll('#worktopSwatches .swatch').length,
              lightingChoices:document.querySelectorAll('.look[data-light]').length,
              branchOptions:[...document.querySelectorAll('#branch option')].map(o=>o.textContent.trim()),
              officialLinks:[...document.querySelectorAll('.official-links a')].map(a=>a.href),
              officialAvatar:(()=>{const i=document.querySelector('img.official-avatar');return i?{hidden:i.hidden,complete:i.complete,naturalWidth:i.naturalWidth}:null})(),
              minTap:[...document.querySelectorAll('.swatch,.look,.question-actions button,.official-links a')].reduce((m,el)=>Math.min(m,el.getBoundingClientRect().height||999),999),
              forbidden:['لمار','966541717080','الرياض','العيدروس','Kitchen Lab','BEASTMODE','Digital Arhat'].filter(x=>document.documentElement.innerHTML.includes(x)),
              nav:performance.getEntriesByType('navigation')[0] ? {
                dom:Math.round(performance.getEntriesByType('navigation')[0].domContentLoadedEventEnd),
                load:Math.round(performance.getEntriesByType('navigation')[0].loadEventEnd)
              } : null
            }));

            if(!res||res.status()>=400) throw new Error(name+': HTTP '+(res?.status()||'none'));
            if(!init.title.includes('نوادر المطابخ الراقية')||!init.brand.includes('نوادر')) throw new Error(name+': identity failed '+JSON.stringify({title:init.title,brand:init.brand}));
            if(init.host!=='nuwadir-alraqiya.vercel.app') throw new Error(name+': wrong client host '+init.host);
            if(init.htmlDir!=='rtl') throw new Error(name+': RTL failed');
            if(init.canvas[0]<100||init.canvas[1]<100||!init.fallbackHidden) throw new Error(name+': WebGL scene failed '+JSON.stringify(init));
            if(init.canvasRect?.w<300||init.canvasRect?.h<350) throw new Error(name+': 3D viewport too small '+JSON.stringify(init.canvasRect));
            if(init.overflow>2) throw new Error(name+': horizontal overflow '+init.overflow);
            if(init.cabinetChoices<8||init.worktopChoices<5||init.lightingChoices!==2) throw new Error(name+': decision controls incomplete '+JSON.stringify(init));
            if(!init.branchOptions.includes('معرض الدمام')||!init.branchOptions.includes('معرض الأحساء')) throw new Error(name+': branch choices missing '+JSON.stringify(init.branchOptions));
            if(init.forbidden.length) throw new Error(name+': cross-prospect contamination '+JSON.stringify(init.forbidden));
            if(init.minTap<40) throw new Error(name+': touch target too short '+init.minTap);
            if(init.officialAvatar && !init.officialAvatar.hidden && (!init.officialAvatar.complete||init.officialAvatar.naturalWidth<20)) throw new Error(name+': visible official avatar broken '+JSON.stringify(init.officialAvatar));
            if(!init.officialLinks.some(x=>x.includes('instagram.com/alraqiyakitchens'))||!init.officialLinks.some(x=>x.includes('linktr.ee/alraqiyakitchens'))) throw new Error(name+': official source links missing '+JSON.stringify(init.officialLinks));

            const before=await p.evaluate(()=>({
              cabinet:document.querySelector('#stateCabinet')?.textContent||'',
              worktop:document.querySelector('#stateWorktop')?.textContent||'',
              light:document.querySelector('#stateLight')?.textContent||''
            }));
            await p.click('#cabinetSwatches .swatch[data-value="sage"]');
            await p.click('#worktopSwatches .swatch[data-value="warmstone"]');
            await p.click('.look[data-light="warm"]');
            await new Promise(r=>setTimeout(r,250));
            const visual=await p.evaluate(()=>({
              cabinet:document.querySelector('#stateCabinet')?.textContent||'',
              worktop:document.querySelector('#stateWorktop')?.textContent||'',
              light:document.querySelector('#stateLight')?.textContent||''
            }));
            if(visual.cabinet===before.cabinet||!visual.cabinet.includes('أخضر')||!visual.worktop.includes('حجر')||!visual.light.includes('دافئة')) throw new Error(name+': visual decisions did not update '+JSON.stringify({before,visual}));

            await p.select('#branch','معرض الأحساء');
            await new Promise(r=>setTimeout(r,100));
            const ahsaWa=await p.$eval('#whatsappLink',a=>a.getAttribute('href')||'');
            if(!ahsaWa.startsWith('https://wa.me/966539455822?text=')) throw new Error(name+': Al Ahsa WhatsApp route failed '+ahsaWa);

            await p.select('#branch','معرض الدمام');
            await p.select('#stageSelect','مطبخ جديد');
            await p.select('#shape','مع جزيرة');
            await p.type('#size','4 × 3 م');
            await p.type('#note','أحتاج مساحة تخزين أكبر');
            await new Promise(r=>setTimeout(r,300));

            const state=await p.evaluate(()=>({
              url:location.href,
              summary:document.querySelector('#summary')?.textContent||'',
              wa:document.querySelector('#whatsappLink')?.getAttribute('href')||'',
              readiness:document.querySelector('#readinessScore')?.textContent||'',
              activeCabinet:document.querySelector('#cabinetSwatches .swatch.active')?.dataset.value||'',
              activeWorktop:document.querySelector('#worktopSwatches .swatch.active')?.dataset.value||''
            }));

            for(const token of ['أخضر هادئ','حجر دافئ','معرض الدمام','مطبخ جديد','مع جزيرة','4 × 3 م','أحتاج مساحة تخزين أكبر']){
              if(!state.summary.includes(token)) throw new Error(name+': summary lost '+token);
            }
            for(const param of ['c=sage','w=warmstone','l=warm','b=','s=','sh=','z=','n=']){
              if(!state.url.includes(param)) throw new Error(name+': state URL missing '+param+' '+state.url);
            }
            if(!state.wa.startsWith('https://wa.me/966550503109?text=')) throw new Error(name+': Dammam WhatsApp route failed '+state.wa);
            const decoded=decodeURIComponent(state.wa);
            for(const token of ['أخضر هادئ','حجر دافئ','معرض الدمام','4 × 3 م','أحتاج مساحة تخزين أكبر']){
              if(!decoded.includes(token)) throw new Error(name+': WhatsApp handoff lost '+token);
            }
            if(state.readiness!=='100%') throw new Error(name+': readiness summary not complete '+state.readiness);

            await p.reload({waitUntil:'networkidle2',timeout:60000});
            await new Promise(r=>setTimeout(r,1200));
            const restored=await p.evaluate(()=>({
              cabinet:document.querySelector('#stateCabinet')?.textContent||'',
              worktop:document.querySelector('#stateWorktop')?.textContent||'',
              light:document.querySelector('#stateLight')?.textContent||'',
              branch:document.querySelector('#branch')?.value||'',
              stage:document.querySelector('#stageSelect')?.value||'',
              shape:document.querySelector('#shape')?.value||'',
              size:document.querySelector('#size')?.value||'',
              note:document.querySelector('#note')?.value||'',
              overflow:document.documentElement.scrollWidth-innerWidth,
              fallbackHidden:document.querySelector('#webglFallback')?.hidden===true,
              wa:document.querySelector('#whatsappLink')?.getAttribute('href')||'',
              avatar:(()=>{const i=document.querySelector('img.official-avatar');return i?{hidden:i.hidden,complete:i.complete,naturalWidth:i.naturalWidth}:null})()
            }));
            if(restored.cabinet!=='أخضر هادئ'||restored.worktop!=='حجر دافئ'||restored.light!=='دافئة'||restored.branch!=='معرض الدمام'||restored.stage!=='مطبخ جديد'||restored.shape!=='مع جزيرة'||restored.size!=='4 × 3 م'||restored.note!=='أحتاج مساحة تخزين أكبر') throw new Error(name+': exact state restore failed '+JSON.stringify(restored));
            if(restored.overflow>2||!restored.fallbackHidden) throw new Error(name+': post-reload layout/WebGL failed '+JSON.stringify(restored));
            if(!restored.wa.startsWith('https://wa.me/966550503109?text=')) throw new Error(name+': restored WhatsApp route failed '+restored.wa);
            if(restored.avatar && !restored.avatar.hidden && (!restored.avatar.complete||restored.avatar.naturalWidth<20)) throw new Error(name+': post-reload visible avatar broken '+JSON.stringify(restored.avatar));

            const meaningful=errors.filter(e=>!e.includes('ERR_BLOCKED_BY_CLIENT'));

            await p.screenshot({path:'/home/runner/work/v7x/v7x/qa-nuwadir-live/live-'+name+'-viewport.png',fullPage:false});
            await p.screenshot({path:'/home/runner/work/v7x/v7x/qa-nuwadir-live/live-'+name+'-full.png',fullPage:true});
            if(meaningful.length||badResponses.length) throw new Error(name+': runtime/network errors '+JSON.stringify({meaningful,badResponses}));
            out.push({viewport:name,http:res.status(),elapsed,init,visual,ahsaWa,state,restored,errors,badResponses});
            await p.close();
          }

          await browser.close();
          fs.writeFileSync('/home/runner/work/v7x/v7x/qa-nuwadir-live/results.json',JSON.stringify(out,null,2));
          console.log('NUWADIR_LIVE_QA_PASS');
          console.log(JSON.stringify(out.map(x=>({
            viewport:x.viewport,http:x.http,canvas:x.init.canvas,canvasRect:x.init.canvasRect,
            overflow:x.init.overflow,minTap:x.init.minTap,elapsed:x.elapsed,
            dom:x.init.nav?.dom,load:x.init.nav?.load,errors:x.errors.length
          })),null,2));
          NODE
      - name: Run live Vercel QA
        run: node /tmp/nuwadir-qa/qa.mjs
      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuwadir-alraqiya-v20-live-vercel-qa
          path: qa-nuwadir-live/
          retention-days: 7
